<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>بوابة خدمات الطلاب — الجامعة السورية للعلوم الأمنية</title>
<meta name="theme-color" content="#054239">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خدمات الطلاب">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>/* Layout: sticky header with role tabs; main area is a two-column workspace (service form + request tracker) that stacks on phones. */
/* هوية الجامعة السورية للعلوم الأمنية: أخضر داكن (#054239) مع ذهبي. الخط يُستبدل بخط الجامعة بوضع ملفه في /fonts (انظر docs/BRANDING.md). */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --surface2:#F6F8F5; --line:#DCE3DD;
  --fg:#10211D; --muted:#566660;
  --accent:#054239; --accent-fg:#FFFFFF; --accent-soft:#E2EEE9;
  --gold:#C9A24B; --gold-2:#E6CB84; --gold-ink:#8A6A1B; --green-d:#032E28; --green-m:#0A5A4D;
  --ok:#1B7F4B; --ok-soft:#DDF3E6; --warn:#9A5600; --warn-soft:#FBEBD0; --bad:#B3261E; --bad-soft:#FBE0DD;
  --hero:linear-gradient(135deg,#032E28 0%,#054239 55%,#0A5A4D 100%);
  --f-ui:"SUSS Sans","Cairo","Tajawal","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  --f-doc:"Traditional Arabic","Noto Naskh Arabic","Amiri","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06201C; --surface:#0B2B25; --surface2:#103832; --line:#1E4840;
    --fg:#EAF1EE; --muted:#9DB5AE; --accent:#D4AF5A; --accent-fg:#052A24; --accent-soft:#16372F; --gold-ink:#E2C27A;
    --ok:#5CD08F; --ok-soft:#12311F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06201C; --surface:#0B2B25; --surface2:#103832; --line:#1E4840;
  --fg:#EAF1EE; --muted:#9DB5AE; --accent:#D4AF5A; --accent-fg:#052A24; --accent-soft:#16372F; --gold-ink:#E2C27A;
  --ok:#5CD08F; --ok-soft:#12311F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.65;direction:rtl;padding-inline:16px;padding-block:0 40px;margin:0}
.wrap{max-width:1080px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}
.brand b{font-size:18px;font-weight:700}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.svc:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{margin-block:14px;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner b{color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:999px;font-weight:600;font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:16.5px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.me{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.me small{color:var(--muted);display:block}
.svcs{display:grid;gap:10px}
.svc{display:flex;gap:12px;text-align:start;align-items:flex-start;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.svc:hover{border-color:var(--accent)}
.svc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.svc b{display:block;font-weight:600}
.svc span{font-size:13px;color:var(--muted)}
.svc i{font-style:normal;font-size:12px;color:var(--accent);margin-inline-start:auto;white-space:nowrap;padding-top:2px}
.form{display:grid;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
label{display:grid;gap:4px;font-size:13.5px;font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
:root[data-theme="dark"] .btn.ok{color:#06210F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok{color:#06210F}}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px;font-weight:400}
.toggle input{width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-review{background:var(--warn-soft);color:var(--warn)}
.p-approved{background:var(--ok-soft);color:var(--ok)}
.p-rejected{background:var(--bad-soft);color:var(--bad)}
.req{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface2)}
.req+.req{margin-top:12px}
.req-h{display:flex;gap:8px 12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.req-h b{font-weight:600}
.no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.steps li{font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:5px}
.steps li.done{border-color:var(--ok);color:var(--fg)}
.steps li.cur{border-color:var(--warn);color:var(--fg);font-weight:600}
.steps li.fail{border-color:var(--bad);color:var(--bad);font-weight:600}
.events{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.reason{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);display:block;font-size:12.5px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td,tr.row[aria-selected="true"] td{background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.checks{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px;font-size:14px}
.checks li::before{content:"✓";color:var(--ok);font-weight:700;margin-inline-end:8px}
.checks li.x::before{content:"✕";color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.audit{font-size:13px}
.audit td{padding:6px 10px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;font-size:13px}
.verify{max-width:640px;margin-inline:auto;display:grid;gap:16px}
.vform{display:flex;gap:8px}
.vform input{direction:ltr;text-align:left;letter-spacing:.05em}
.result{border-radius:12px;padding:16px;border:1px solid}
.result.good{background:var(--ok-soft);border-color:var(--ok)}
.result.badr{background:var(--bad-soft);border-color:var(--bad)}
.result h3{font-size:17px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.6);z-index:20;display:grid;place-items:start center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.sheet{width:min(720px,100%)}
.sheet-bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.doc{background:#FFFFFF;color:#1B1B1B;border-radius:6px;padding:clamp(18px,5vw,42px);font-family:var(--f-doc);font-size:19px;line-height:2;border:1px solid #C9CED4;position:relative}
.doc h2{font-size:26px;text-align:center;margin-bottom:2px;color:#054239}
.doc .sub{text-align:center;font-size:15px;color:#555;margin-bottom:18px}
.doc hr{border:0;border-top:2px solid #054239;margin:10px 0 18px}
.doc table{font-size:16px}
.doc th{color:#333;border-bottom:1px solid #999}
.doc td{border-bottom:1px solid #ddd}
.doc-foot{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px;border-top:1px solid #bbb;padding-top:14px;font-family:var(--f-ui);font-size:12.5px;color:#444}
.qr{width:112px;height:112px;flex:none;background:#fff;padding:4px;border:1px solid #bbb}
.qr svg{width:100%;height:100%;display:block}
.stamp{font-family:var(--f-ui);font-size:12px;border:1px dashed #054239;color:#054239;padding:2px 10px;border-radius:4px;display:inline-block}
.toast[hidden]{display:none}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;z-index:30;pointer-events:none}
.toast span{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.toast span{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
.login{max-width:400px;margin:12vh auto 0;display:grid;gap:14px}
.login h1{font-size:22px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:14px}
.who{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.who b{color:var(--fg)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.small{font-size:12.5px;color:var(--muted)}
td .btn{white-space:nowrap}

.qr img{width:100%;height:100%;display:block}

/* ---- تسجيل الطلاب ---- */
.regform{display:grid;gap:18px}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin:0;background:var(--surface2)}
.sec legend{padding:0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec legend .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.fgrid label.wide{grid-column:1/-1}
.fgrid label,.inline-form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.req-m{color:var(--bad);font-style:normal}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad);outline:2px solid var(--bad-soft)}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);padding:10px 0;border-top:1px solid var(--line);margin:0}
.sec-h{font-size:13px;color:var(--accent);margin:16px 0 4px}
.kv.big dd{font-size:20px;letter-spacing:1px;font-weight:700}
.cred{border:2px solid var(--ok)}
@media print{
  body *{visibility:hidden}
  #credcard,#credcard *{visibility:visible}
  #credcard{position:absolute;inset:0 0 auto 0;border:2px solid #000;box-shadow:none}
  .no-print{display:none!important}
}

/* ====== واجهة الطالب بنمط تطبيق الجوال ====== */
.badge-n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;line-height:20px;text-align:center;margin-inline-start:4px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.mini-list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.mini-list li{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
body.is-m{padding-inline:0;padding-block:0}
.m-app,.m-full,.m-drawer-bd{--accent:#054239;--accent-fg:#fff;--accent-soft:#E2EEE9;--mline:#DCE3DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-app,:root:not([data-theme="light"]) .m-full,:root:not([data-theme="light"]) .m-drawer-bd{--accent:#D4AF5A;--accent-fg:#052A24;--accent-soft:#16372F;--mline:#1E4840}}
.m-app{max-width:520px;margin-inline:auto;min-height:100vh;min-height:100dvh;background:var(--surface);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--line)}
.m-main{padding:16px 16px 24px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.m-head h1{font-size:22px;font-weight:800}
.m-hello{display:flex;align-items:center;gap:12px;padding:6px 0 16px;border-bottom:1px solid var(--mline);margin-bottom:14px}
.m-hello small{display:block;color:var(--muted);font-size:13px}.m-hello b{font-size:18px}
.m-avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:19px;cursor:pointer;flex:none}
.m-avatar.big{width:56px;height:56px;cursor:default}
.m-sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}.m-sec h2{font-size:17px;font-weight:800}
.m-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.m-news-c{flex:0 0 78%;scroll-snap-align:start;text-align:start;border:1px solid var(--mline);background:linear-gradient(160deg,var(--accent-soft),var(--surface));border-radius:14px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer}
.m-news-c .d{font-size:12px;color:var(--muted)}.m-news-c b{font-size:15px;line-height:1.5}
.m-svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-svc{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:start;border:1px solid var(--mline);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;min-height:96px;justify-content:space-between}
.m-svc.wide{grid-column:1/-1}
.m-svc b{font-size:15px}
.m-svc .ic{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;align-self:flex-end}
.m-svc:hover,.m-svc:focus-visible{border-color:var(--accent)}
.m-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.m-chip{flex:none;border:1px solid var(--mline);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
.m-chip[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.m-sort{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:14px;color:var(--muted)}
.m-sort select{width:auto;border-radius:8px;padding:6px 10px}
.m-list{display:grid;gap:10px}
.m-card{border:1px solid var(--mline);border-radius:12px;padding:12px 14px;background:var(--surface);display:grid;gap:3px;position:relative}
.m-card b{font-size:15.5px}.m-card small{color:var(--muted)}
.m-card.g hr{border:0;border-top:1px solid var(--mline);margin:8px 0 4px;width:100%}
.m-badge{justify-self:start;display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 10px 2px 8px;margin-bottom:4px}
.m-badge.ok{background:var(--ok);color:#fff}.m-badge.bad{background:var(--bad);color:#fff}
.m-marks{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}.m-marks b{color:var(--fg);margin-inline-start:4px}
.m-prev{display:flex;justify-content:space-between;align-items:center;border:0;border-top:1px solid var(--mline);background:none;color:var(--accent);padding:10px 0 2px;margin-top:6px;cursor:pointer;font-weight:600;width:100%}
.m-prev svg{transform:scaleX(-1) rotate(0deg)}
.m-prev[aria-expanded="true"] svg{transform:rotate(90deg)}
.m-prevrow{background:var(--surface2);border-radius:8px;padding:8px 10px;display:grid;gap:2px;margin-top:6px}
.m-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.m-sum div{background:var(--surface2);border-radius:10px;padding:8px 4px;text-align:center}.m-sum b{display:block;font-size:19px}.m-sum small{color:var(--muted);font-size:12px}
.m-sum .ok b{color:var(--ok)}.m-sum .bad b{color:var(--bad)}
.m-news-r{display:flex;text-align:start;border:1px solid var(--mline);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.m-news-r .t{display:grid;gap:2px}.m-news-r small{color:var(--muted);font-size:12px}.m-news-r b{font-size:15.5px;line-height:1.5}.m-news-r .ex{color:var(--muted);font-size:13.5px}
.m-empty{text-align:center;color:var(--muted);padding:28px 12px}.m-empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}.m-empty p{margin:0 0 14px;font-size:14px}
.m-empty.big{padding-top:22vh}.m-empty.small-e{padding:14px}
.m-btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:15px}
.m-btn:disabled{opacity:.6;cursor:wait}
.m-form .m-btn{width:100%;margin-top:6px}
.m-fab{position:fixed;inset-inline-start:max(16px,calc(50% - 244px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.m-reqh{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:0;cursor:pointer}
.m-reqh>span{display:grid}.m-reqh small{color:var(--muted);font-size:12.5px}
.m-det{border-top:1px solid var(--mline);margin-top:10px;padding-top:10px}
.m-nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--mline);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
.m-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);padding:9px 2px 8px;cursor:pointer;font-size:11.5px}
.m-nav button[aria-current="page"]{color:var(--accent);font-weight:800}
.m-nav button[aria-current="page"] svg{stroke-width:2.4}
.m-nav button:focus-visible,.m-svc:focus-visible,.m-chip:focus-visible,.m-news-c:focus-visible,.m-btn:focus-visible,.m-fab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.m-verify .verify{padding:0}.m-back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:700;padding:6px 0}
/* هياكل التحميل */
.sk-card{border:1px solid var(--mline);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--surface)}
.sk-l{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface2),var(--mline),var(--surface2));background-size:200% 100%}
.w60{width:60%}.w40{width:40%}
@media (prefers-reduced-motion:no-preference){.sk-l{animation:sk 1.3s linear infinite}@keyframes sk{to{background-position:-200% 0}}}
/* نوافذ كاملة */
.m-full{position:fixed;inset:0;background:var(--surface);z-index:40;overflow-y:auto}
.m-full-in{max-width:520px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column}
.m-fh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--mline);position:sticky;top:0;background:var(--surface);z-index:1}
.m-fh h2{font-size:19px;font-weight:800}
.m-fb{padding:16px;flex:1}
.m-ff{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;text-align:start}
.m-lead{color:var(--muted);margin:0 0 14px}
.m-emblem{display:grid;place-items:center;color:var(--accent);margin:6px 0 18px}
.m-form{display:grid;gap:12px}
.m-h3{font-size:16px;margin:22px 0 10px}
.m-reply{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.m-article h3{font-size:19px;margin:6px 0 10px}.m-article p{line-height:1.9}
/* القائمة الجانبية */
.m-drawer-bd{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:40;display:flex;justify-content:flex-start}
.m-drawer{width:min(86vw,360px);height:100%;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;padding:18px 18px 24px;gap:14px}
@media (prefers-reduced-motion:no-preference){.m-drawer{animation:slidein .22s ease-out}@keyframes slidein{from{transform:translateX(40px);opacity:.4}}}
.m-drawer header{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--mline);padding-bottom:14px}.m-drawer header small{display:block;color:var(--muted);font-size:12.5px;word-break:break-all}
.m-kv{padding:6px 0;display:grid}.m-kv small{color:var(--muted);font-size:12.5px}.m-kv b{font-size:15px}
.m-info{border-bottom:1px solid var(--mline);padding-bottom:8px}
.m-acts{display:grid;gap:2px}.m-acts button{display:flex;gap:12px;align-items:center;border:0;background:none;padding:12px 4px;cursor:pointer;font-size:15px;color:var(--fg);text-align:start;border-radius:8px}
.m-acts button svg{color:var(--accent)}.m-acts button:hover{background:var(--surface2)}.m-acts .out,.m-acts .out svg{color:var(--bad)}
@media print{.m-nav,.m-fab{display:none}}
/* في واجهة الطالب يرتفع التنبيه فوق الشريط السفلي كي لا يغطي التنقل */
body:has(.m-app) .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

<script>// مولّد رمز QR محلي (وضع البايتات، تصحيح أخطاء M، الإصدارات 1-10) بلا اعتماديات.
// يُولَّد الرمز على الخادم، فلا تحميل لمكتبات خارجية ولا إرسال لرموز التحقق إلى أي جهة.
const ECC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
const NUM_BLOCKS    = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];

function rawModules(ver) {
  let r = (16 * ver + 128) * ver + 64;
  if (ver >= 2) {
    const n = Math.floor(ver / 7) + 2;
    r -= (25 * n - 10) * n - 55;
    if (ver >= 7) r -= 36;
  }
  return r;
}
const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

// حقل غالوا GF(256) بكثير الحدود 0x11D
function gfMul(x, y) {
  let z = 0;
  for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
  return z;
}
function rsDivisor(deg) {
  const r = new Array(deg).fill(0); r[deg - 1] = 1;
  let root = 1;
  for (let i = 0; i < deg; i++) {
    for (let j = 0; j < deg; j++) { r[j] = gfMul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; }
    root = gfMul(root, 0x02);
  }
  return r;
}
function rsRemainder(data, div) {
  const r = new Array(div.length).fill(0);
  for (const b of data) {
    const f = b ^ r.shift(); r.push(0);
    div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
  }
  return r;
}

function encodeData(bytes, ver) {
  const bits = [];
  const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(0b0100, 4); put(bytes.length, ver < 10 ? 8 : 16);
  for (const b of bytes) put(b, 8);
  const cap = dataCodewords(ver) * 8;
  put(0, Math.min(4, cap - bits.length));
  put(0, (8 - (bits.length % 8)) % 8);
  const out = [];
  for (let i = 0; i < bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8).join(''), 2));
  for (let pad = 0xEC; out.length < dataCodewords(ver); pad ^= 0xEC ^ 0x11) out.push(pad);
  return out;
}

function interleave(data, ver) {
  const nb = NUM_BLOCKS[ver], ecc = ECC_PER_BLOCK[ver], raw = Math.floor(rawModules(ver) / 8);
  const shortCount = nb - (raw % nb), shortLen = Math.floor(raw / nb);
  const div = rsDivisor(ecc), blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const dat = data.slice(k, k + shortLen - ecc + (i < shortCount ? 0 : 1)); k += dat.length;
    const e = rsRemainder(dat, div);
    if (i < shortCount) dat.push(0);
    blocks.push(dat.concat(e));
  }
  const out = [];
  for (let i = 0; i < blocks[0].length; i++)
    blocks.forEach((b, j) => { if (i !== shortLen - ecc || j >= shortCount) out.push(b[i]); });
  return out;
}

    for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(bits, i));
    for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(bits, i));
    for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(bits, i));

    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0];

    let p = 0;
    const lines = [];

    for (const l of lines) {

      for (let i = 1; i <= size; i++) {

      }
      for (let i = 0; i + 11 <= size; i++) {
        const s = l.slice(i, i + 11).map(Number).join('');
        if (s === '10111010000' || s === '00001011101') p += 40;
      }
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++)
      if (mod[y][x] === mod[y][x + 1] && mod[y][x] === mod[y + 1][x] && mod[y][x] === mod[y + 1][x + 1]) p += 3;
    const dark = mod.flat().filter(Boolean).length, total = size * size;
    p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
    return p;
  };
  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) {
    applyMask(m); drawFormat(m);
    const p = penalty();
    if (p < bestP) { bestP = p; best = m; }
    applyMask(m);
  }

}

function qrSvg(text, { quiet = 4 } = {}) {
  const { size, modules } = makeQr(text);
  const total = size + quiet * 2;
  let d = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (modules[y][x]) d += `M${x + quiet} ${y + quiet}h1v1h-1z`;

    const stats = st ? `<div class="stats"><div class="stat"><small>قيد المراجعة</small><b>${st.review}</b></div><div class="stat"><small>معتمدة</small><b>${st.approved}</b></div><div class="stat"><small>مرفوضة</small><b>${st.rejected}</b></div><div class="stat"><small>متوسط زمن الاعتماد</small><b style="font-size:20px">${st.avgApprovalMs ? dur(st.avgApprovalMs) : '-'}</b></div></div>
      ${st.slaBreaches ? `<p class="reason" style="margin-top:12px">${st.slaBreaches} طلب تجاوز مدة الخدمة المعتمدة (SLA).</p>` : ''}` : '';

    const tabs = [['requests', can('request:decide') ? 'طابور الطلبات' : 'الطلبات']];
    if (can('student:read')) tabs.push(['list', 'سجل الطلاب']);
    if (can('student:register')) tabs.push(['new', 'تسجيل طالب جديد']);
    const cur = S.stTab === 'edit' ? 'list' : S.stTab;
    const bar = `<div class="sub-tabs no-print" role="tablist">${tabs.map((t) => `<button class="chip" role="tab" data-act="sttab" data-t="${t[0]}" aria-pressed="${cur === t[0]}">${t[1]}${t[0] === 'requests' && st && st.review ? ` <span class="badge-n">${st.review}</span>` : ''}</button>`).join('')}</div>`;
    return `${stats}<div style="margin-top:16px">${bar}</div>` + (S.stTab === 'requests' || !tabs.some((t) => t[0] === cur) ? requestsBody() : studentsView());
  }

  function requestsBody() {
    const canDecide = can('request:decide');
    const fl = [['all', 'الكل'], ['review', 'قيد المراجعة'], ['approved', 'معتمدة'], ['rejected', 'مرفوضة']];
    const list = S.requests.filter((r) => S.filter === 'all' || r.status === S.filter);
    const sel = S.requests.find((r) => r.id === S.sel);
    const rows = list.map((r) => `<tr class="row" tabindex="0" data-act="sel" data-id="${r.id}" aria-selected="${S.sel === r.id}"><td>${esc(r.service.label)}</td><td>${esc(r.student.name)}</td><td>${pill(r)}</td><td class="hint" style="white-space:nowrap">${fmt(r.createdAt)}</td></tr>`).join('');
    return `<div class="grid2"><section class="card"><h2>طابور الطلبات</h2><div class="chips">${fl.map((f) => `<button class="chip" data-act="flt" data-f="${f[0]}" aria-pressed="${S.filter === f[0]}">${f[1]}</button>`).join('')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>الخدمة</th><th>الطالب</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">لا طلبات في هذا التصنيف.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>تفاصيل الطلب</h2>${sel ? staffDetail(sel, canDecide) : '<div class="empty">اختر طلباً من الطابور.</div>'}</section></div>`;
  }
  function staffDetail(r, canDecide) {
    const auto = r.rejectedBy === 'auto';
    let act = '';
    if (r.status === 'review' && canDecide) {
      act = `<div class="actions"><button class="btn ok" data-act="approve" data-id="${r.id}">اعتماد وإصدار الوثيقة</button><button class="btn bad" data-act="rejform" data-id="${r.id}">رفض</button></div>` +
        (S.rej === r.id ? `<div class="form" style="margin-top:12px"><label>سبب الرفض (يظهر للطالب)<textarea id="rej-text" rows="2" maxlength="300"></textarea></label><div class="actions" style="margin:0"><button class="btn bad" data-act="reject" data-id="${r.id}">تأكيد الرفض</button></div></div>` : '');
    } else if (r.document) act = `<div class="actions"><button class="btn pri" data-act="doc" data-c="${esc(r.document.code)}">عرض الوثيقة</button></div>`;
    else if (r.status === 'rejected') act = `<div class="reason" style="margin-top:8px">${esc(r.rejectReason)}</div>`;
    const att = r.attachment ? `<dt>المرفق</dt><dd><a href="/api/attachments/${r.attachment.id}">${esc(r.attachment.name)}</a> <span class="small">(${Math.round(r.attachment.size / 1024)} ك.ب)</span></dd>` : '';
    return `<dl class="kv"><dt>الطلب</dt><dd>${esc(r.service.label)} <span class="no">${esc(r.no)}</span></dd><dt>الطالب</dt><dd>${esc(r.student.name)} · ${esc(r.student.studentNo)}${can('student:read') && r.student.id ? ` <button class="link" data-act="openstud" data-id="${r.student.id}">فتح ملف الطالب</button>` : ''}</dd><dt>التفاصيل</dt><dd>${esc(detailsText(r))}</dd><dt>الحالة</dt><dd>${pill(r)}</dd>${r.decidedAt ? `<dt>زمن المعالجة</dt><dd>${dur(r.decidedAt - r.createdAt)}</dd>` : ''}${att}</dl>
      <b style="display:block;margin-top:12px;font-size:14px">الفحص الآلي</b><ul class="checks"><li class="${auto ? 'x' : ''}">${auto ? esc(r.rejectReason) : 'اجتاز كل القواعد المفعَّلة'}</li></ul>${act}<div style="margin-top:12px">${events(r)}</div>`;
  }

  function adminView() {
    const tabs = [['holds', 'الذمم والموانع'], ['rules', 'قواعد الفحص الآلي'], ['programs', 'البرامج الأكاديمية'], ['users', 'المستخدمون']];
    const bar = `<div class="sub-tabs">${tabs.map((t) => `<button class="chip" data-act="atab" data-t="${t[0]}" aria-pressed="${S.adminTab === t[0]}">${t[1]}</button>`).join('')}</div>`;
    const a = S.admin;
    if (S.adminTab === 'holds') {
      return bar + `<section class="card"><h2>تسجيل ذمة على طالب</h2><div class="inline-form"><label>الرقم الجامعي<input id="h-no" placeholder="2024-0000"></label>
        <label>النوع<select id="h-type"><option value="financial">مالية</option><option value="disciplinary">تأديبية</option><option value="library">مكتبة</option></select></label><label>ملاحظة<input id="h-note" maxlength="200"></label><button class="btn pri" data-act="addhold">تسجيل</button></div></section>
        <section class="card" style="margin-top:16px"><h2>الذمم</h2><div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>النوع</th><th>الملاحظة</th><th>الحالة</th><th></th></tr></thead><tbody>${(a.holds || []).map((h) => `<tr><td>${esc(h.student)} <span class="small">${esc(h.studentNo)}</span></td><td>${{ financial: 'مالية', disciplinary: 'تأديبية', library: 'مكتبة' }[h.holdType]}</td><td>${esc(h.note)}</td><td>${h.active ? '<span class="bad-t">قائمة</span>' : '<span class="ok-t">مسددة</span>'}</td><td>${h.active ? `<button class="btn sm" data-act="clearhold" data-id="${h.id}">تسوية</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">لا ذمم مسجلة.</td></tr>'}</tbody></table></div></section>`;
    }
    if (S.adminTab === 'rules') {
      return bar + `<section class="card"><h2>قواعد الفحص الآلي</h2><p class="hint">تُطبَّق على كل طلب قبل وصوله للموظف. التعطيل والتفعيل يُسجَّلان في سجل التدقيق.</p><div class="tbl-wrap"><table><thead><tr><th>القاعدة</th><th>الخدمة</th><th>رسالة الرفض</th><th></th></tr></thead><tbody>${(a.rules || []).map((r) => `<tr><td class="mono">${esc(r.kind)} ${esc(r.params)}</td><td>${esc(r.service ?? 'كل الخدمات')}</td><td>${esc(r.message)}</td><td><button class="btn sm" data-act="rule" data-id="${r.id}" data-on="${r.enabled ? 0 : 1}">${r.enabled ? 'تعطيل' : 'تفعيل'}</button></td></tr>`).join('')}</tbody></table></div></section>`;
    }
    if (S.adminTab === 'programs') {
      return bar + `<section class="card"><h2>برنامج أكاديمي جديد</h2><div class="inline-form"><label>الكلية<input id="pg-fac" maxlength="80"></label><label>البرنامج<input id="pg-name" maxlength="80"></label><label>الدرجة<input id="pg-deg" value="بكالوريوس" maxlength="30"></label>
        <label>المدة (سنوات)<input id="pg-years" type="number" min="1" max="7" value="4"></label><button class="btn pri" data-act="addprog">إضافة</button></div><p class="small">البرامج المعطَّلة تختفي من نموذج التسجيل، ويبقى الطلاب المسجَّلون فيها.</p></section>
        <section class="card" style="margin-top:16px"><h2>البرامج</h2><div class="tbl-wrap"><table><thead><tr><th>الكلية</th><th>البرنامج</th><th>المدة</th><th>الطلاب</th><th></th></tr></thead><tbody>${(a.programs || []).map((p) => `<tr><td>${esc(p.faculty)}</td><td>${esc(p.degree)} ${esc(p.name)}</td><td>${p.years}</td><td>${p.students}</td><td><button class="btn sm" data-act="progtoggle" data-id="${p.id}" data-on="${p.active ? 0 : 1}">${p.active ? 'تعطيل' : 'تفعيل'}</button></td></tr>`).join('')}</tbody></table></div></section>`;
    }
    return bar + `<section class="card"><h2>مستخدم جديد</h2><div class="inline-form"><label>اسم المستخدم<input id="u-name" autocomplete="off"></label><label>الاسم الكامل<input id="u-disp"></label>
      <label>الدور<select id="u-role"><option value="staff">موظف</option><option value="auditor">مدقق</option><option value="admin">مدير</option></select></label><label>كلمة مرور مؤقتة<input id="u-pw" type="password" autocomplete="new-password"></label><button class="btn pri" data-act="adduser">إنشاء</button></div><p class="small">10 أحرف على الأقل وتحوي حروفاً وأرقاماً.</p></section>
      <section class="card" style="margin-top:16px"><h2>المستخدمون</h2><div class="tbl-wrap"><table><thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الرقم الجامعي</th></tr></thead><tbody>${(a.users || []).map((u) => `<tr><td class="mono">${esc(u.username)}</td><td>${esc(u.name)}</td><td>${ROLE_LABEL[u.role]}</td><td>${esc(u.studentNo ?? '')}</td></tr>`).join('')}</tbody></table></div></section>`;
  }


  /* ---------- تغيير كلمة المرور الإلزامي ---------- */
  function mustChangeView() {
    return `<form class="login card" id="pwform"><h1>تغيير كلمة المرور</h1><div class="hint">سُجِّل دخولك بكلمة مرور مؤقتة. اختر كلمة مرور خاصة بك للمتابعة.</div>
      ${S.err ? `<div class="err" role="alert">${esc(S.err)}</div>` : ''}
      <label>كلمة المرور المؤقتة<input id="pw-cur" type="password" autocomplete="current-password" required></label>
      <label>كلمة المرور الجديدة<input id="pw-new" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>تأكيد كلمة المرور الجديدة<input id="pw-new2" type="password" autocomplete="new-password" required minlength="10"></label>
      <div class="small">10 أحرف على الأقل، وتحوي حروفاً وأرقاماً.</div>
      <button class="btn pri" type="submit">حفظ ومتابعة</button><button class="btn sm" type="button" data-act="logout">خروج</button></form>`;
  }

  /* ---------- تسجيل الطلاب ---------- */
  const STATUS_CLS = { active: 'p-approved', suspended: 'p-review', withdrawn: 'p-rejected', transferred: 'p-rejected', graduated: 'p-review' };
  const spill = (st, label) => `<span class="pill ${STATUS_CLS[st] || ''}">${esc(label)}</span>`;
  const today = () => new Date().toISOString().slice(0, 10);

  function fieldHtml(f, v) {
    const id = 'sf-' + f.name, req = f.required ? ' required' : '', inv = S.fieldErr === f.name ? ' aria-invalid="true"' : '';
    const val0 = v === undefined || v === null ? (f.default ?? '') : v;
    let ctl;
    if (f.type === 'select' || f.type === 'program') {
      ctl = `<select id="${id}"${req}${inv}>${f.required && f.type === 'program' ? '<option value="">— اختر —</option>' : (f.required ? '' : '<option value="">—</option>')}${f.options.map((o) => `<option value="${esc(o.v)}"${String(o.v) === String(val0) ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    } else if (f.type === 'longtext') ctl = `<textarea id="${id}" rows="2" maxlength="${f.max}"${inv}>${esc(val0)}</textarea>`;
    else if (f.type === 'date') ctl = `<input id="${id}" type="date" max="${today()}" value="${esc(val0)}"${req}${inv}>`;
    else if (f.type === 'int') ctl = `<input id="${id}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" value="${esc(val0)}"${req}${inv}>`;
    else if (f.type === 'num') ctl = `<input id="${id}" type="number" inputmode="decimal" min="0" max="${f.max}" step="any" value="${esc(val0)}"${req}${inv}>`;
    else if (f.type === 'tel') ctl = `<input id="${id}" type="tel" inputmode="tel" dir="ltr" pattern="\\+?[0-9][0-9 \\-]{6,19}" value="${esc(val0)}" placeholder="09xxxxxxxx"${req}${inv}>`;
    else if (f.type === 'email') ctl = `<input id="${id}" type="email" dir="ltr" maxlength="120" value="${esc(val0)}"${req}${inv}>`;
    else if (f.type === 'nid') ctl = `<input id="${id}" dir="ltr" inputmode="numeric" maxlength="20" pattern="[0-9A-Za-z ]{6,20}" autocomplete="off" value="${esc(val0)}"${req}${inv}>`;
    else if (f.type === 'latin') ctl = `<input id="${id}" dir="ltr" maxlength="${f.max}" value="${esc(val0)}"${req}${inv}>`;
    else ctl = `<input id="${id}" type="text" maxlength="${f.max ?? 100}" value="${esc(val0)}"${req}${inv}>`;
    return `<label class="${f.wide ? 'wide' : ''}"><span>${esc(f.label)}${f.required ? ' <i class="req-m" aria-hidden="true">*</i>' : ''}</span>${ctl}${f.hint ? `<span class="small">${esc(f.hint)}</span>` : ''}</label>`;
  }
  function studentForm(values, edit) {
    const secs = S.reg.sections.map((sec, i) => `<fieldset class="sec"><legend><span class="n">${i + 1}</span>${esc(sec.title)}</legend><div class="fgrid">${sec.fields.filter((f) => edit || !f.editOnly).map((f) => fieldHtml(f, values[f.name])).join('')}</div></fieldset>`).join('');
    return `<form id="regform" class="regform" novalidate-off>${S.err ? `<div class="err" role="alert">${esc(S.err)}</div>` : ''}${secs}
      <div class="actions sticky-actions"><button class="btn pri" type="submit">${edit ? 'حفظ التعديلات' : 'تسجيل الطالب'}</button><button class="btn" type="button" data-act="${edit ? 'stcancel' : 'stclear'}">${edit ? 'إلغاء' : 'تفريغ النموذج'}</button>
      <span class="small" style="align-self:center">الحقول المعلَّمة بـ <i class="req-m">*</i> إلزامية. يُولَّد الرقم الجامعي وكلمة المرور المؤقتة تلقائياً.</span></div></form>`;
  }
  function credCard() {
    const c = S.cred; if (!c) return '';
    return `<section class="card cred" id="credcard"><h2>تم تسجيل الطالب</h2><p class="hint" style="margin-top:0"><b>${esc(c.name)}</b> — سلِّم هذه البيانات للطالب الآن. كلمة المرور المؤقتة تُعرض مرة واحدة فقط، وسيُطلب منه تغييرها عند أول دخول.</p>
      <dl class="kv big"><dt>الرقم الجامعي (اسم المستخدم)</dt><dd class="mono" dir="ltr">${esc(c.username)}</dd><dt>كلمة المرور المؤقتة</dt><dd class="mono" dir="ltr">${esc(c.tempPassword)}</dd></dl>
      <div class="actions no-print"><button class="btn pri" data-act="credcopy">نسخ</button><button class="btn" data-act="credprint">طباعة</button><button class="btn" data-act="credopen">فتح ملف الطالب</button><button class="btn" data-act="crednew">تسجيل طالب آخر</button></div></section>`;
  }
  function studentsView() {
    if (!S.reg) return '<div class="empty">جارٍ التحميل…</div>';
    const bar = '';
    if (S.stTab === 'new') return bar + (S.cred ? credCard() : `<section class="card"><h2>تسجيل طالب جديد</h2>${studentForm(S.newVals || {}, false)}</section>`);
    if (S.stTab === 'edit' && S.stEdit) return bar + `<section class="card"><h2>تعديل ملف: ${esc(S.stEdit.name)} <span class="mono small">${esc(S.stEdit.studentNo)}</span></h2>${studentForm(S.stEdit.profile, true)}</section>`;
    const L = S.stList, progOpts = S.reg.sections.flatMap((x) => x.fields).find((f) => f.name === 'program_id').options;
    const rows = L.students.map((st) => `<tr class="row" tabindex="0" data-act="stsel" data-id="${st.id}" aria-selected="${S.stSel && S.stSel.id === st.id}"><td class="mono">${esc(st.studentNo)}</td><td>${esc(st.name)}</td><td class="hint">${esc(st.program.name)} · ${esc(st.levelLabel)}</td><td>${spill(st.status, st.statusLabel)}</td></tr>`).join('');
    return bar + `<div class="grid2"><section class="card"><h2>سجل الطلاب <span class="small">(${L.total})</span></h2>
      <form class="inline-form" id="stsearch"><label>بحث<input id="st-q" value="${esc(L.q)}" placeholder="اسم، رقم جامعي، رقم وطني، هاتف" maxlength="60"></label>
        <label>البرنامج<select id="st-prog"><option value="">الكل</option>${progOpts.map((o) => `<option value="${o.v}"${String(o.v) === String(L.program) ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}</select></label>
        <label>الحالة<select id="st-status"><option value="">الكل</option>${Object.entries(S.reg.statuses).map(([k, v]) => `<option value="${k}"${k === L.status ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
        <button class="btn pri" type="submit">بحث</button></form>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>الرقم</th><th>الاسم</th><th>البرنامج</th><th>الحالة</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">لا طلاب مسجَّلون بعد. ابدأ بـ «تسجيل طالب جديد».</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>ملف الطالب</h2>${S.stSel ? studentDetail(S.stSel) : '<div class="empty">اختر طالباً من السجل لعرض ملفه.</div>'}</section></div>`;
  }
  const kvrow = (k, v) => (v === null || v === undefined || v === '' ? '' : `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`);
  function profileKv(st) {
    const p = st.profile, F = Object.fromEntries(S.reg ? S.reg.sections.flatMap((x) => x.fields).map((f) => [f.name, f]) : []);
    const lab = (n) => (F[n] ? F[n].label : n);
    return S.profSections.map((sec) => `<h3 class="sec-h">${esc(sec.title)}</h3><dl class="kv">${sec.fields.map((f) => {
      if (f.name === 'status') return kvrow(lab('status'), st.statusLabel);
      if (f.name === 'program_id') return kvrow('الكلية والبرنامج', `${st.program.faculty} — ${st.program.degree} ${st.program.name}`);
      if (f.name === 'study_level') return kvrow(lab('study_level'), st.levelLabel);
      return kvrow(lab(f.name), p[f.name]);
    }).join('')}${sec.id === 'certificate' && st.hsPercent !== null ? kvrow('النسبة المئوية', st.hsPercent + '%') : ''}</dl>`).join('');
  }
  function relatedRequests(st) {
    const rs = (S.requests || []).filter((r) => r.student && r.student.studentNo === st.studentNo);
    if (!rs.length) return '';
    return `<h3 class="sec-h">طلبات الطالب</h3><ul class="mini-list">${rs.map((r) => `<li><button class="link" data-act="reqopen" data-id="${r.id}">${esc(r.service.label)} · <span class="mono">${esc(r.no)}</span></button> ${pill(r)}</li>`).join('')}</ul>`;
  }
  function studentDetail(st) {
    return `<div class="me"><div class="avatar">${esc(st.name[0])}</div><div><b>${esc(st.name)}</b><small class="mono">${esc(st.studentNo)}</small></div></div>
      <div style="margin:8px 0">${spill(st.status, st.statusLabel)} ${st.activeHolds ? `<span class="pill p-rejected">${st.activeHolds} ذمة قائمة</span>` : ''}</div>
      <div class="actions no-print"><button class="btn pri sm" data-act="stedit">تعديل</button><button class="btn sm" data-act="stpw">إعادة تعيين كلمة المرور</button></div>
      ${relatedRequests(st)}${profileKv(st)}<p class="small">سُجِّل ${fmt(st.createdAt)} · آخر تعديل ${fmt(st.updatedAt)}</p>`;
  }
  function auditView() {
    const c = S.chain;
    return `<section class="card"><h2>سجل التدقيق (إضافة فقط)</h2><div class="actions" style="margin-top:0"><button class="btn pri sm" data-act="chain">تحقق من سلامة السلسلة</button>
      ${c ? `<span class="${c.ok ? 'ok-t' : 'bad-t'}" style="align-self:center">${c.ok ? `السلسلة سليمة (${c.checked} سجلاً)` : `كُسرت السلسلة عند السجل ${c.brokenAtId}`}</span>` : ''}</div>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>الوقت</th><th>المنفِّذ</th><th>الإجراء</th><th>المرجع</th><th>IP</th></tr></thead><tbody>${(S.audit || []).map((a) => `<tr><td>${a.id}</td><td style="white-space:nowrap">${fmt(a.at)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.ref)}</td><td class="mono">${esc(a.ip ?? '')}</td></tr>`).join('')}</tbody></table></div></section>`;
  }

  function verifyView() {
    const r = S.vres; let res = '';
    if (r) {
      if (r.valid) res = `<div class="result good"><h3>الوثيقة صحيحة وصادرة عن الجامعة</h3><dl class="kv"><dt>النوع</dt><dd>${esc(r.service)}</dd><dt>الطالب</dt><dd>${esc(r.student)}</dd><dt>تاريخ الإصدار</dt><dd>${fmt(r.issuedAt)}</dd><dt>بصمة الوثيقة</dt><dd class="mono">${esc(r.hashPrefix)}…</dd></dl><p class="hint" style="margin-bottom:0">أُعيد حساب البصمة والتوقيع من سجل الجامعة وطابقا المخزَّنين وقت الإصدار.</p></div>`;
      else if (r.reason === 'tampered') res = '<div class="result badr"><h3>تحذير: بيانات الوثيقة لا تطابق السجل</h3>فشل التحقق من البصمة أو التوقيع، فقد تكون الوثيقة عُدِّلت.</div>';
      else if (r.reason === 'malformed') res = '<div class="result badr"><h3>صيغة الرمز غير صحيحة</h3>الصيغة المتوقعة: UV-XXXX-XXXX</div>';
      else res = '<div class="result badr"><h3>الوثيقة غير موجودة</h3>لا توجد وثيقة بهذا الرمز في سجلات الجامعة.</div>';
    }

      <form class="vform" id="vform"><input id="vcode" type="text" placeholder="UV-XXXX-XXXX" autocomplete="off" value="${esc(S.vtext)}" aria-label="رمز التحقق"><button class="btn pri" type="submit">تحقق</button></form></section>${res}</div>`;
  }

    if (p.service.code === 'excellence_year') body = `<p>تشهد ${esc(p.university)} بأنه تقرر قبول تسجيل الطالب/ـة ${who}، المقيَّد/ـة في برنامج «${esc(st.program)}»، في سنة الامتياز للعام الدراسي ${esc(p.details.academic_year)}.</p>${p.details.notes ? `<p>ملاحظات: ${esc(p.details.notes)}</p>` : ''}`;
    if (p.service.code === 'excuse') body = `<p>بعد مراجعة المرفقات والتحقق من استيفائها للمدة النظامية، تقرر قبول العذر المقدَّم من الطالب/ـة ${who} عن امتحان مقرر «${esc(p.details.course)}» بتاريخ ${esc(p.details.exam_date)} (السبب: ${esc(p.details.reason)})، وتحديد موعد امتحان بديل.</p>`;
    return `<div class="doc"><div class="doc-head"><img class="crest" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjQwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Iti02LnYp9ixINin2YTYrNin2YXYudipICjZhtiz2K7YqSDYqNiv2YrZhNipINmF2KTZgtiq2KkpIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiMwQTVBNEQiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMwMzJFMjgiLz48L2xpbmVhckdyYWRpZW50Pgo8bGluZWFyR3JhZGllbnQgaWQ9ImF1IiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjRTZDQjg0Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjQzlBMjRCIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+CjxwYXRoIGQ9Ik0xMDAgMTAgTDE3OCAzNyBWMTEyIEMxNzggMTY2IDE0MyAyMDYgMTAwIDIyOCBDNTcgMjA2IDIyIDE2NiAyMiAxMTIgVjM3IFoiIGZpbGw9InVybCgjZykiIHN0cm9rZT0idXJsKCNhdSkiIHN0cm9rZS13aWR0aD0iNiIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8cGF0aCBkPSJNMTAwIDI0IEwxNjYgNDYgVjExMiBDMTY2IDE1OCAxMzcgMTkzIDEwMCAyMTMgQzYzIDE5MyAzNCAxNTggMzQgMTEyIFY0NiBaIiBmaWxsPSJub25lIiBzdHJva2U9IiNDOUEyNEIiIHN0cm9rZS13aWR0aD0iMS42IiBvcGFjaXR5PSIuNyIvPgo8cG9seWdvbiBwb2ludHM9IjY4LjAsNTIuMCA3MC41LDU4LjYgNzcuNSw1OC45IDcyLjAsNjMuMyA3My45LDcwLjEgNjguMCw2Ni4yIDYyLjEsNzAuMSA2NC4wLDYzLjMgNTguNSw1OC45IDY1LjUsNTguNiIgZmlsbD0iI0U2Q0I4NCIvPjxwb2x5Z29uIHBvaW50cz0iMTAwLjAsNDIuMCAxMDMuMCw0OS45IDExMS40LDUwLjMgMTA0LjgsNTUuNiAxMDcuMSw2My43IDEwMC4wLDU5LjAgOTIuOSw2My43IDk1LjIsNTUuNiA4OC42LDUwLjMgOTcuMCw0OS45IiBmaWxsPSIjRTZDQjg0Ii8+PHBvbHlnb24gcG9pbnRzPSIxMzIuMCw1Mi4wIDEzNC41LDU4LjYgMTQxLjUsNTguOSAxMzYuMCw2My4zIDEzNy45LDcwLjEgMTMyLjAsNjYuMiAxMjYuMSw3MC4xIDEyOC4wLDYzLjMgMTIyLjUsNTguOSAxMjkuNSw1OC42IiBmaWxsPSIjRTZDQjg0Ii8+CjxwYXRoIGQ9Ik0xMDAgNzggTDEwOCAxMDAgTDEwMCAxMjggTDkyIDEwMCBaIiBmaWxsPSJ1cmwoI2F1KSIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iMi42IiBmaWxsPSIjMDMyRTI4Ii8+CjxwYXRoIGQ9Ik01MCAxMzYgUTc1IDEyMyAxMDAgMTM2IFExMjUgMTIzIDE1MCAxMzYgVjE3NiBRMTI1IDE2NCAxMDAgMTc3IFE3NSAxNjQgNTAgMTc2IFoiIGZpbGw9InVybCgjYXUpIi8+CjxwYXRoIGQ9Ik0xMDAgMTM2IFYxNzciIHN       <div class="doc-foot"><div><span class="stamp">موقّعة رقمياً</span><div style="margin-top:8px">رقم الطلب: <span class="mono">${esc(p.requestNo)}</span></div><div>تاريخ الإصدار: ${fmt(p.issuedAt)}</div><div>رمز التحقق: <span class="mono">${esc(d.code)}</span></div><div>البصمة: <span class="mono">${esc(d.hash.slice(0, 20))}…</span></div></div><div class="qr"><img alt="رمز QR للتحقق" src="/api/documents/${encodeURIComponent(d.code)}/qr.svg"></div></div></div>`;
  }

  /* ---------- العرض والأحداث ---------- */
  const BUILTIN = { affairs: affairsView, admin: adminView, audit: auditView };
  function render() {
    const app = $('#app');
    document.body.classList.toggle('is-m', !!(S.me && S.me.role === 'student' && !S.me.mustChange));
    if (!S.me && S.view !== 'verify') { app.innerHTML = loginView() + siteFoot(); return; }
    if (S.me && S.me.mustChange) { app.innerHTML = mustChangeView(); return; }
    if (S.me && S.me.role === 'student') { app.innerHTML = UA.studentShell(); return; }
    const v = S.view === 'verify' ? verifyView : (UA.views[S.view] || BUILTIN[S.view] || (() => ''));
    app.innerHTML = header() + '<main>' + v() + '</main></div>' + siteFoot();
  }
  async function loadFor(view) {
    if (!S.me) return;
    try {
      if (UA.loaders[view]) await UA.loaders[view]();
      else if (view === 'affairs') {
        const [r, st] = await Promise.all([api('GET', '/api/requests'), can('stats:read') ? api('GET', '/api/stats') : Promise.resolve(null)]);
        S.requests = r.requests; S.stats = st && st.stats;
        if (can('student:register') && !S.reg) { S.reg = await api('GET', '/api/registration/options'); S.profSections = S.reg.sections; }
        if (can('student:read')) await loadStudents();
      } else if (view === 'admin') {
        const [h, r, u, pg] = await Promise.all([api('GET', '/api/admin/holds'), api('GET', '/api/admin/rules'), api('GET', '/api/admin/users'), api('GET', '/api/programs')]);
        S.admin = { holds: h.holds, rules: r.rules, users: u.users, programs: pg.programs };
      } else if (view === 'audit') S.audit = (await api('GET', '/api/audit?limit=100')).entries;
    } catch (e) { if (e.status !== 401) toast(e.message); }
  }
  async function loadStudents() {
    const L = S.stList, p = new URLSearchParams();
    if (L.q) p.set('q', L.q); if (L.program) p.set('program', L.program); if (L.status) p.set('status', L.status);
    const r = await api('GET', '/api/students?' + p);
    L.students = r.students; L.total = r.total;
  }
  function collect(secs, edit) {
    const o = {};
    secs.forEach((sec) => sec.fields.forEach((f) => { if (f.editOnly && !edit) return; const e = document.getElementById('sf-' + f.name); if (e) o[f.name] = e.value; }));
    return o;
  }
  function showErr(e) {
    S.err = e.message; S.fieldErr = e.field || null;
    return e;
  }
  async function go(view) { S.view = view; await loadFor(view); render(); window.scrollTo(0, 0); }
  async function afterLogin(user) {
    S.me = user; S.err = '';
    if (user.mustChange) { render(); return; }
    S.services = (await api('GET', '/api/services')).services;
    await go(viewsFor(user.role)[0][0]);
  }
  async function doVerify(code) {
    S.vtext = (code ?? '').trim().toUpperCase();
    if (!S.vtext) { S.vres = null; return; }
    try { S.vres = await api('GET', '/api/verify/' + encodeURIComponent(S.vtext)); } catch (e) { S.vres = null; toast(e.message); }
  }
  const readFile = (f) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(f); });
  async function guard(fn) { try { await fn(); } catch (e) { toast(e.message); } }

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (UA.forms[e.target.id]) { await guard(() => UA.forms[e.target.id](e.target)); return; }
    if (e.target.id === 'loginform') {
      await guard(async () => {
        try { const r = await api('POST', '/api/auth/login', { username: val('lg-u'), password: val('lg-p') }); await afterLogin(r.user); }
        catch (err) { if (err.status) { S.err = err.message; render(); } else throw err; }
      });
    } else if (e.target.id === 'pwform') {
      const cur = val('pw-cur'), nw = val('pw-new');
      if (nw !== val('pw-new2')) { S.err = 'تأكيد كلمة المرور غير مطابق.'; render(); return; }
      try { await api('POST', '/api/auth/change-password', { current: cur, next: nw }); S.err = ''; S.me.mustChange = false; await afterLogin(S.me); toast('تم تغيير كلمة المرور'); }
      catch (err) { S.err = err.message; render(); }
    } else if (e.target.id === 'stsearch') {
      Object.assign(S.stList, { q: val('st-q').trim(), program: val('st-prog'), status: val('st-status') }); await guard(async () => { await loadStudents(); S.stSel = null; render(); });
    } else if (e.target.id === 'regform') {
      const edit = S.stTab === 'edit';
      await guard(async () => {
        const body = collect(S.reg.sections, edit);
        try {
          if (edit) {
            const r = await api('PUT', '/api/students/' + S.stEdit.id, body);
            S.stSel = r.student; S.stTab = 'list'; S.stEdit = null; S.err = ''; S.fieldErr = null; await loadStudents(); render(); toast('حُفظت التعديلات');
          } else {
            const r = await api('POST', '/api/students', body);
            S.cred = { ...r.credentials, name: r.student.name, id: r.student.id }; S.newVals = {}; S.err = ''; S.fieldErr = null; render(); window.scrollTo(0, 0);
          }
        } catch (err) {
          if (!err.status) throw err;
          S.newVals = edit ? S.newVals : body; if (edit) S.stEdit.profile = { ...S.stEdit.profile, ...body };
          showErr(err); render();
          const el = err.field && document.getElementById('sf-' + err.field); if (el) el.focus(); else window.scrollTo(0, 0);
        }
      });
    } else if (e.target.id === 'vform') { await doVerify(val('vcode')); render(); }
  });

  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, d = el.dataset;
    if (a === 'close') { if ((el.classList.contains('overlay') && e.target.closest('.sheet')) || (el.classList.contains('m-drawer-bd') && e.target.closest('.m-drawer'))) return; $('#layer').innerHTML = ''; return; }
    await guard(async () => {
      if (UA.actions[a]) await UA.actions[a](el, d, e);
      else if (a === 'view') await go(d.v);
      else if (a === 'tologin') { S.view = null; render(); }
      else if (a === 'goverify') { S.view = 'verify'; render(); }
      else if (a === 'logout') { await api('POST', '/api/auth/logout', {}); $('#layer').innerHTML = ''; UA.reset(); Object.assign(S, { me: null, view: null, requests: [], sel: null, reg: null, profile: null, stTab: 'requests', stSel: null, stEdit: null, cred: null }); render(); }
      else if (a === 'sel') { S.sel = Number(d.id); S.rej = null; render(); }
      else if (a === 'flt') { S.filter = d.f; render(); }
      else if (a === 'approve') { await api('POST', `/api/requests/${d.id}/approve`, {}); await loadFor('affairs'); render(); toast('تم الاعتماد وإصدار الوثيقة'); }
      else if (a === 'rejform') { S.rej = Number(d.id); render(); }
      else if (a === 'reject') { await api('POST', `/api/requests/${d.id}/reject`, { reason: val('rej-text') }); S.rej = null; await loadFor('affairs'); render(); toast('تم رفض الطلب'); }
      else if (a === 'doc') {
        const r = await api('GET', '/api/documents/' + encodeURIComponent(d.c));
        $('#layer').innerHTML = `<div class="overlay" dir="rtl" data-act="close"><div class="sheet"><div class="sheet-bar"><button class="btn" data-act="close">إغلاق</button><button class="btn pri" data-act="copy" data-c="${esc(d.c)}">نسخ رمز التحقق</button></div>${docHtml(r.document)}</div></div>`;
      }
      else if (a === 'copy') { try { await navigator.clipboard.writeText(d.c); toast('تم نسخ الرمز'); } catch { toast('الرمز: ' + d.c); } }
      else if (a === 'atab') { S.adminTab = d.t; render(); }
      else if (a === 'addhold') { await api('POST', '/api/admin/holds', { studentNo: val('h-no'), holdType: val('h-type'), note: val('h-note') }); await loadFor('admin'); render(); toast('سُجّلت الذمة'); }
      else if (a === 'clearhold') { await api('POST', `/api/admin/holds/${d.id}/clear`, {}); await loadFor('admin'); render(); toast('تمت التسوية'); }
      else if (a === 'rule') { await api('POST', `/api/admin/rules/${d.id}/toggle`, { enabled: d.on === '1' }); await loadFor('admin'); render(); }
      else if (a === 'adduser') {
        await api('POST', '/api/admin/users', { username: val('u-name'), displayName: val('u-disp'), role: val('u-role'), password: val('u-pw') });
        await loadFor('admin'); render(); toast('أُنشئ المستخدم');
      }
      else if (a === 'sttab') { S.stTab = d.t; S.err = ''; S.fieldErr = null; S.stEdit = null; if (d.t === 'list') await loadStudents(); render(); }
      else if (a === 'stsel') { S.stSel = (await api('GET', '/api/students/' + d.id)).student; render(); }
      else if (a === 'stedit') { S.stEdit = S.stSel; S.stTab = 'edit'; S.err = ''; S.fieldErr = null; render(); window.scrollTo(0, 0); }
      else if (a === 'stcancel') { S.stTab = 'list'; S.stEdit = null; S.err = ''; S.fieldErr = null; render(); }
      else if (a === 'stclear') { S.newVals = {}; S.err = ''; S.fieldErr = null; render(); }
      else if (a === 'stpw') {
        if (!confirm('سيُنشأ كلمة مرور مؤقتة جديدة وتُنهى جلسات الطالب الحالية. متابعة؟')) return;
        const r = await api('POST', `/api/students/${S.stSel.id}/reset-password`, {});
        S.cred = { ...r.credentials, name: S.stSel.name, id: S.stSel.id }; S.stTab = 'new'; render();
      }
      else if (a === 'credcopy') { try { await navigator.clipboard.writeText(`${S.cred.username}\n${S.cred.tempPassword}`); toast('تم النسخ'); } catch { toast('تعذّر النسخ؛ انسخ يدوياً'); } }
      else if (a === 'credprint') window.print();
      else if (a === 'credopen') { const id = S.cred.id; S.cred = null; S.stTab = 'list'; S.stSel = (await api('GET', '/api/students/' + id)).student; await loadStudents(); render(); }
      else if (a === 'crednew') { S.cred = null; S.newVals = {}; render(); }
      else if (a === 'addprog') { await api('POST', '/api/admin/programs', { faculty: val('pg-fac'), name: val('pg-name'), degree: val('pg-deg'), years: Number(val('pg-years')) }); S.reg = null; await loadFor('admin'); render(); toast('أُضيف البرنامج'); }
      else if (a === 'progtoggle') { await api('POST', `/api/admin/programs/${d.id}/toggle`, { enabled: d.on === '1' }); S.reg = null; await loadFor('admin'); render(); }
      else if (a === 'reqopen') { S.stTab = 'requests'; S.sel = Number(d.id); S.rej = null; render(); window.scrollTo(0, 0); }
      else if (a === 'openstud') { S.stSel = (await api('GET', '/api/students/' + d.id)).student; S.stTab = 'list'; render(); window.scrollTo(0, 0); }
      else if (a === 'chain') { S.chain = await api('GET', '/api/audit/verify'); render(); }
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('#layer').innerHTML = '';
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.row')) { e.preventDefault(); e.target.click(); }
  });

  /* ---------- الإقلاع ---------- */
  UA.start = async function start() {
    const params = new URLSearchParams(location.search), code = params.get('verify');
    try { const r = await api('GET', '/api/me'); S.uni = r.university ?? S.uni; if (r.user) await afterLogin(r.user); } catch { S.me = null; }
    if (code) { S.view = 'verify'; await doVerify(code); history.replaceState(null, '', location.pathname); }
    render();
  };
  Object.assign(UA, { viewsFor, S, api, esc, fmt, dur, $, val, toast, render, guard, go, loadFor, can, pill, steps, detailsText, events, docHtml, verifyView, readFile, afterLogin, ROLE_LABEL });
})();
</script>
<script>/* واجهة الموظف: المواد والعلامات، والأخبار والشكاوى (تُضاف إلى نواة app.js عبر UA) */
(function () {
  const UA = window.UA, { S, api, esc, fmt, val, toast } = UA;
  const LV = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة'];
  const lvl = (n) => 'السنة ' + (LV[n - 1] || n);
  const sem = (n) => (n === 1 ? 'الفصل الأول' : 'الفصل الثاني');
  const defYear = () => { const d = new Date(), y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; return `${y}/${y + 1}`; };

  const A = { tab: 'courses', programs: [], program: '', level: '', courses: [], gq: '', gres: null, gs: null, gdata: null, gcourses: [], gerr: '', news: [], cmps: [], cfilter: 'open', csel: null };
  UA.reset = () => Object.assign(A, { tab: 'courses', program: '', level: '', courses: [], gres: null, gs: null, gdata: null, news: [], cmps: [], csel: null });

  const bar = (tabs, cur, act) => `<div class="sub-tabs no-print" role="tablist">${tabs.map((t) => `<button class="chip" role="tab" data-act="${act}" data-t="${t[0]}" aria-pressed="${cur === t[0]}">${t[1]}</button>`).join('')}</div>`;
  const progOpts = (sel) => A.programs.map((p) => `<option value="${p.id}"${String(p.id) === String(sel) ? ' selected' : ''}>${esc(p.faculty)} — ${esc(p.degree)} ${esc(p.name)}</option>`).join('');
  const lvlOpts = (sel, all) => (all ? '<option value="">كل السنوات</option>' : '') + [1, 2, 3, 4, 5, 6, 7].map((n) => `<option value="${n}"${String(n) === String(sel) ? ' selected' : ''}>${lvl(n)}</option>`).join('');

  /* ---------- المواد والعلامات ---------- */
  async function loadCourses() {
    const q = new URLSearchParams(); if (A.program) q.set('program', A.program); if (A.level) q.set('level', A.level);
    A.courses = A.program ? (await api('GET', '/api/courses?' + q)).courses : [];
  }
  UA.loaders.academics = async () => {
    if (!A.programs.length) { A.programs = (await api('GET', '/api/programs')).programs; if (!A.program && A.programs.length) A.program = String(A.programs[0].id); }
    await loadCourses();
  };
  function coursesTab() {
    const rows = A.courses.map((c) => `<tr><td>${lvl(c.level)}</td><td>${sem(c.semester)}</td><td>${esc(c.name)}${c.code ? ` <span class="mono small">${esc(c.code)}</span>` : ''}</td><td>${c.hours}</td><td>${esc(c.instructor || '—')}</td>
      <td>${c.active ? '<span class="pill p-approved">فعّال</span>' : '<span class="pill p-rejected">معطَّل</span>'}</td><td><button class="btn sm" data-act="actoggle" data-id="${c.id}" data-on="${c.active ? 0 : 1}">${c.active ? 'تعطيل' : 'تفعيل'}</button></td></tr>`).join('');
    return `<div class="grid2"><section class="card"><h2>دليل المواد</h2>
      <form class="inline-form" id="acfilter"><label>البرنامج<select id="ac-prog">${progOpts(A.program)}</select></label><label>السنة<select id="ac-lvl">${lvlOpts(A.level, true)}</select></label><button class="btn pri" type="submit">عرض</button></form>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>السنة</th><th>الفصل</th><th>المقرر</th><th>ساعات</th><th>المدرّس</th><th>الحالة</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">لا مقررات بعد لهذا البرنامج. أضف أول مقرر من النموذج المجاور.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>إضافة مقرر</h2><form class="form" id="acadd" style="border:0;margin:0;padding:0">
        <label>البرنامج<select id="ac-nprog">${progOpts(A.program)}</select></label>
        <div class="two"><label>السنة الدراسية<select id="ac-nlvl">${lvlOpts(A.level || 1)}</select></label><label>الفصل<select id="ac-nsem"><option value="1">الأول</option><option value="2">الثاني</option></select></label></div>
        <label>اسم المقرر<input id="ac-nname" maxlength="100" required></label>
        <div class="two"><label>الساعات<input id="ac-nhours" type="number" min="0" max="12" value="3"></label><label>الرمز (اختياري)<input id="ac-ncode" maxlength="20" dir="ltr"></label></div>
        <label>المدرّس (اختياري)<input id="ac-ninst" maxlength="80"></label>
        <div class="actions" style="margin:0"><button class="btn pri" type="submit">إضافة المقرر</button></div></form></section></div>`;
  }
  function gradesTab() {
    const found = A.gres ? `<ul class="mini-list">${A.gres.length ? A.gres.map((s) => `<li><button class="link" data-act="acpick" data-id="${s.id}">${esc(s.name)} · <span class="mono">${esc(s.studentNo)}</span></button> <span class="small">${esc(s.program.name)} · ${esc(s.levelLabel)}</span></li>`).join('') : '<li class="empty">لا نتائج.</li>'}</ul>` : '';
    let right = '<div class="empty">ابحث عن طالب ثم اخترْه لإدخال علاماته.</div>';
    if (A.gs) {
      const g = A.gdata;
      const rows = g.grades.map((x) => `<tr><td>${esc(x.course)}</td><td>${lvl(x.level)} · ${sem(x.semester)}</td><td>${esc(x.academicYear || '')}</td><td>${x.theory ?? '—'}</td><td>${x.practical ?? '—'}</td><td><b>${x.total}</b></td><td><span class="pill ${x.passed ? 'p-approved' : 'p-rejected'}">${x.passed ? 'ناجح' : 'راسب'}</span>${x.previous.length ? ` <span class="small">(+${x.previous.length} سابقة)</span>` : ''}</td></tr>`).join('');
      right = `<div class="me"><div class="avatar">${esc(A.gs.name[0])}</div><div><b>${esc(A.gs.name)}</b><small class="mono">${esc(A.gs.studentNo)} · ${esc(A.gs.program.name)} · ${esc(A.gs.levelLabel)}</small></div></div>
        ${A.gerr ? `<div class="err" role="alert" style="margin-top:12px">${esc(A.gerr)}</div>` : ''}
        <form class="form" id="acgrade"><label>المقرر<select id="gr-course" required><option value="">— اختر —</option>${A.gcourses.map((c) => `<option value="${c.id}">${lvl(c.level)} · ${sem(c.semester)} — ${esc(c.name)}</option>`).join('')}</select></label>
          <div class="two"><label>العام الدراسي<input id="gr-year" value="${defYear()}" dir="ltr" pattern="\\d{4}/\\d{4}" required></label><span></span></div>
          <div class="two"><label>العلامة النظرية<input id="gr-th" type="number" min="0" max="100" required></label><label>العلامة العملية<input id="gr-pr" type="number" min="0" max="100"></label></div>
          <div class="small">مجموع العلامتين لا يتجاوز 100، والنجاح من ${g.passMark}. إعادة إدخال العلامة لنفس المقرر والعام تعدّلها (ويُسجَّل ذلك).</div>
          <div class="actions" style="margin:0"><button class="btn pri" type="submit">حفظ العلامة</button></div></form>
        <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>المقرر</th><th>السنة/الفصل</th><th>العام</th><th>نظري</th><th>عملي</th><th>المجموع</th><th>الحالة</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">لا علامات مسجَّلة.</td></tr>'}</tbody></table></div>`;
    }
    return `<div class="grid2"><section class="card"><h2>اختيار الطالب</h2><form class="inline-form" id="acsearch"><label>بحث<input id="ac-q" value="${esc(A.gq)}" placeholder="اسم أو رقم جامعي" maxlength="60"></label><button class="btn pri" type="submit">بحث</button></form>${found}</section>
      <section class="card"><h2>إدخال العلامات</h2>${right}</section></div>`;
  }
  UA.views.academics = () => bar([['courses', 'دليل المواد'], ['grades', 'إدخال العلامات']], A.tab, 'actab') + (A.tab === 'courses' ? coursesTab() : gradesTab());

  async function pickStudent(id) {
    A.gs = (await api('GET', '/api/students/' + id)).student; A.gerr = '';
    [A.gdata, A.gcourses] = await Promise.all([api('GET', `/api/students/${id}/grades`), api('GET', '/api/courses?program=' + A.gs.program.id).then((r) => r.courses.filter((c) => c.active))]);
  }
  Object.assign(UA.actions, {
    actab: async (el, d) => { A.tab = d.t; UA.render(); },
    actoggle: async (el, d) => { await api('POST', `/api/courses/${d.id}/toggle`, { enabled: d.on === '1' }); await loadCourses(); UA.render(); },
    acpick: async (el, d) => { await pickStudent(d.id); UA.render(); },
  });
  Object.assign(UA.forms, {
    acfilter: async () => { A.program = val('ac-prog'); A.level = val('ac-lvl'); await loadCourses(); UA.render(); },
    acadd: async () => {
      const programId = Number(val('ac-nprog'));
      try {
        await api('POST', '/api/courses', { programId, level: Number(val('ac-nlvl')), semester: Number(val('ac-nsem')), name: val('ac-nname'), hours: Number(val('ac-nhours')), code: val('ac-ncode'), instructor: val('ac-ninst') });
        A.program = String(programId); await loadCourses(); UA.render(); toast('أُضيف المقرر');
      } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    acsearch: async () => { A.gq = val('ac-q').trim(); A.gres = (await api('GET', '/api/students?' + new URLSearchParams({ q: A.gq }))).students.slice(0, 10); UA.render(); },
    acgrade: async () => {
      try {
        A.gdata = await api('POST', `/api/students/${A.gs.id}/grades`, { courseId: Number(val('gr-course')), academicYear: val('gr-year'), theory: val('gr-th'), practical: val('gr-pr') });
        A.gerr = ''; UA.render(); toast('حُفظت العلامة');
      } catch (e) { if (!e.status) throw e; A.gerr = e.message; UA.render(); }
    },
  });

  /* ---------- الأخبار والشكاوى ---------- */
  const CST = { open: ['p-review', 'قيد المعالجة'], answered: ['p-approved', 'تم الرد'], closed: ['p-approved', 'مغلقة'] };
  UA.loaders.comms = async () => {
    const q = A.cfilter === 'all' ? '' : '?status=' + A.cfilter;
    [A.news, A.cmps] = await Promise.all([api('GET', '/api/news').then((r) => r.news), api('GET', '/api/complaints' + q).then((r) => r.complaints)]);
  };
  function newsTab() {
    return `<div class="grid2"><section class="card"><h2>نشر خبر</h2><form class="form" id="newsadd" style="border:0;margin:0;padding:0"><label>العنوان<input id="nw-title" maxlength="150" required></label>
        <label>النص<textarea id="nw-body" rows="5" maxlength="4000" required></textarea></label><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="nw-pin" type="checkbox" style="width:auto"> تثبيت في أعلى القائمة</label>
        <div class="actions" style="margin:0"><button class="btn pri" type="submit">نشر</button></div></form></section>
      <section class="card"><h2>الأخبار المنشورة <span class="small">(${A.news.length})</span></h2>${A.news.length ? A.news.map((n) => `<article class="req"><div class="req-h"><b>${n.pinned ? '📌 ' : ''}${esc(n.title)}</b><button class="btn sm bad" data-act="newsdel" data-id="${n.id}">حذف</button></div><div class="no">${fmt(n.publishedAt)}</div><div class="hint" style="white-space:pre-wrap">${esc(n.body.length > 220 ? n.body.slice(0, 220) + '…' : n.body)}</div></article>`).join('') : '<div class="empty">لا أخبار بعد. ما تنشره يظهر لكل الطلاب في تطبيقهم.</div>'}</section></div>`;
  }
  function complaintsTab() {
    const fl = [['open', 'قيد المعالجة'], ['answered', 'تم الرد'], ['closed', 'مغلقة'], ['all', 'الكل']];
    const sel = A.cmps.find((c) => c.id === A.csel);
    const rows = A.cmps.map((c) => `<tr class="row" tabindex="0" data-act="cmpsel" data-id="${c.id}" aria-selected="${A.csel === c.id}"><td>${esc(c.subject)}</td><td>${esc(c.student.name)}</td><td><span class="pill ${CST[c.status][0]}">${CST[c.status][1]}</span></td><td class="hint" style="white-space:nowrap">${fmt(c.createdAt)}</td></tr>`).join('');
    const det = sel ? `<dl class="kv"><dt>الرقم</dt><dd class="mono">${esc(sel.no)}</dd><dt>الطالب</dt><dd>${esc(sel.student.name)} · ${esc(sel.student.studentNo)}</dd><dt>الموضوع</dt><dd>${esc(sel.subject)}</dd><dt>النص</dt><dd style="white-space:pre-wrap">${esc(sel.body)}</dd>${sel.response ? `<dt>الرد</dt><dd style="white-space:pre-wrap">${esc(sel.response)}</dd>` : ''}</dl>
      ${sel.status !== 'closed' ? `<form class="form" id="cmpresp"><label>${sel.response ? 'رد إضافي' : 'الرد على الطالب'}<textarea id="cm-resp" rows="3" maxlength="1000" required></textarea></label><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="cm-close" type="checkbox" style="width:auto"> إغلاق الشكوى بعد الرد</label><div class="actions" style="margin:0"><button class="btn pri" type="submit">إرسال الرد</button></div></form>` : ''}` : '<div class="empty">اختر شكوى من القائمة.</div>';
    return `<div class="grid2"><section class="card"><h2>الشكاوى</h2><div class="chips">${fl.map((f) => `<button class="chip" data-act="cmpflt" data-f="${f[0]}" aria-pressed="${A.cfilter === f[0]}">${f[1]}</button>`).join('')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>الموضوع</th><th>الطالب</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">لا شكاوى في هذا التصنيف.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>تفاصيل الشكوى</h2>${det}</section></div>`;
  }
  UA.views.comms = () => bar([['news', 'الأخبار'], ['complaints', 'الشكاوى']], A.ctab || 'news', 'cmtab') + ((A.ctab || 'news') === 'news' ? newsTab() : complaintsTab());
  Object.assign(UA.actions, {
    cmtab: async (el, d) => { A.ctab = d.t; UA.render(); },
    cmpflt: async (el, d) => { A.cfilter = d.f; A.csel = null; await UA.loaders.comms(); UA.render(); },
    cmpsel: async (el, d) => { A.csel = Number(d.id); UA.render(); },
    newsdel: async (el, d) => { if (!confirm('حذف هذا الخبر نهائياً؟')) return; await api('DELETE', '/api/news/' + d.id); await UA.loaders.comms(); UA.render(); toast('حُذف الخبر'); },
  });
  Object.assign(UA.forms, {
    newsadd: async () => {
      try { await api('POST', '/api/news', { title: val('nw-title'), body: val('nw-body'), pinned: document.getElementById('nw-pin').checked }); await UA.loaders.comms(); UA.render(); toast('نُشر الخبر'); }
      catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    cmpresp: async () => {
      try { await api('POST', `/api/complaints/${A.csel}/respond`, { response: val('cm-resp'), close: document.getElementById('cm-close').checked }); await UA.loaders.comms(); UA.render(); toast('أُرسل الرد'); }
      catch (e) { if (!e.status) throw e; toast(e.message); }
    },
  });
})();
</script>
<script>/* واجهة الطالب بنمط تطبيق الجوال: الرئيسية، دليل المواد، علاماتي، الأخبار، معاملاتي + قائمة الملف الشخصي */
(function () {
  const UA = window.UA, { S, api, esc, fmt, val, toast } = UA;
  const LV = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة'];
  const GOV = ['دمشق', 'ريف دمشق', 'حلب', 'حمص', 'حماة', 'اللاذقية', 'طرطوس', 'إدلب', 'درعا', 'السويداء', 'القنيطرة', 'دير الزور', 'الرقة', 'الحسكة', 'خارج سوريا'];
  const SEM_LABEL = { 1: 'الفصل الأول', 2: 'الفصل الثاني' };
  const day = (t) => { try { return new Date(t).toLocaleDateString('ar-EG-u-nu-latn', { dateStyle: 'medium' }); } catch { return ''; } };

  const T = { profile: null, news: null, courses: null, grades: null, reqs: null, cmps: null, loading: {},
    guide: { level: null, sem: '' }, gr: { level: null, sem: '', open: {} }, openReq: {}, wz: null, error: '' };
  UA.reset = () => Object.assign(T, { profile: null, news: null, courses: null, grades: null, reqs: null, cmps: null, loading: {}, guide: { level: null, sem: '' }, gr: { level: null, sem: '', open: {} }, openReq: {}, wz: null });

  /* ---------- أيقونات ---------- */
  const svg = (d, extra = '') => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
  const IC = {
    home: svg('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
    guide: svg('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>'),
    grades: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15l2.5-5 2.5 5M8 13.5h3"/><path d="M15 10v5M13 12.5h4"/>'),
    news: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>'),
    tx: svg('<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>'),
    cap: svg('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>'),
    doc: svg('<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>'),
    bed: svg('<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 00-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>'),
    back: svg('<path d="M9 5l7 7-7 7"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    out: svg('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'),
    edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
    lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),
    help: svg('<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
    check: svg('<path d="M5 12l5 5 9-10"/>', 'width="16" height="16"'),
    cross: svg('<path d="M6 6l12 12M18 6L6 18"/>', 'width="16" height="16"'),
    shield: svg('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'),
  };
  const svcIcon = (c) => ({ transcript: IC.doc, excellence_year: IC.cap, campus_life: IC.bed }[c] || IC.doc);

  /* ---------- مكونات ---------- */
