<script>/* واجهة الموظف: المواد والعلامات، والأخبار والشكاوى (تُضاف إلى نواة app.js عبر UA) */
(function () {
  const UA = window.UA, { S, api, esc, fmt, val, toast } = UA;
  const LV = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة'];
  const lvl = (n) => 'السنة ' + (LV[n - 1] || n);
  const sem = (n) => (n === 1 ? 'الفصل الأول' : 'الفصل الثاني');
  const defYear = () => { const d = new Date(), y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; return `${y}/${y + 1}`; };

  const A = { tab: 'courses', programs: [], program: '', level: '', courses: [], gq: '', gres: null, gs: null, gdata: null, gcourses: [], gerr: '', news: [], cmps: [], cfilter: 'open', csel: null, cedit: null, nedit: null };
  UA.reset = () => Object.assign(A, { tab: 'courses', program: '', level: '', courses: [], gres: null, gs: null, gdata: null, news: [], cmps: [], csel: null, cedit: null, nedit: null });

  const bar = (tabs, cur, act) => `<div class="sub-tabs no-print" role="tablist">${tabs.map((t) => `<button class="chip" role="tab" data-act="${act}" data-t="${t[0]}" aria-pressed="${cur === t[0]}">${t[1]}</button>`).join('')}</div>`;
  const progOpts = (sel) => A.programs.map((p) => `<option value="${p.id}"${String(p.id) === String(sel) ? ' selected' : ''}>${esc(p.label || p.name)}</option>`).join('');
  const yrs = (pid) => ((A.programs.find((p) => String(p.id) === String(pid)) || {}).years) || 4;   // مدة البرنامج: 3 للكلية الأمنية و4 للأمن السيبراني
  const lvlOpts = (sel, all, progId = A.program) => (all ? '<option value="">كل السنوات</option>' : '') + Array.from({ length: yrs(progId) }, (_, i) => i + 1).map((n) => `<option value="${n}"${String(n) === String(sel) ? ' selected' : ''}>${lvl(n)}</option>`).join('');

  /* ---------- المواد والعلامات ---------- */
  async function loadCourses() {
    const q = new URLSearchParams(); if (A.program) q.set('program', A.program); if (A.level) q.set('level', A.level);
    A.courses = A.program ? (await api('GET', '/api/courses?' + q)).courses : [];
  }
  UA.loaders.academics = async () => {
    if (!A.programs.length) { A.programs = (await api('GET', '/api/programs')).programs.filter((p) => p.active); if (!A.program && A.programs.length) A.program = String(A.programs[0].id); }
    await loadCourses();
  };
  function coursesTab() {
    const rows = A.courses.map((c) => `<tr><td>${lvl(c.level)}</td><td>${sem(c.semester)}</td><td>${esc(c.name)}${c.code ? ` <span class="mono small">${esc(c.code)}</span>` : ''}</td><td>${c.hours}</td><td>${esc(c.instructor || '—')}</td>
      <td>${c.active ? '<span class="pill p-approved">فعّال</span>' : '<span class="pill p-rejected">معطَّل</span>'}</td><td><button class="btn sm" data-act="actoggle" data-id="${c.id}" data-on="${c.active ? 0 : 1}">${c.active ? 'تعطيل' : 'تفعيل'}</button> <button class="btn sm" data-act="acedit" data-id="${c.id}">تعديل</button> <button class="btn sm bad" data-act="acdel" data-id="${c.id}">حذف</button></td></tr>`).join('');
    const ce = A.cedit ? A.courses.find((c) => c.id === A.cedit) : null;
    return `<div class="grid2"><section class="card"><h2>دليل المواد</h2>
      <form class="inline-form" id="acfilter"><label>البرنامج<select id="ac-prog">${progOpts(A.program)}</select></label><label>السنة<select id="ac-lvl">${lvlOpts(A.level, true)}</select></label><button class="btn pri" type="submit">عرض</button></form>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>السنة</th><th>الفصل</th><th>المقرر</th><th>ساعات</th><th>المدرّس</th><th>الحالة</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">لا مقررات بعد لهذا البرنامج. أضف أول مقرر من النموذج المجاور.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>${ce ? 'تعديل مقرر' : 'إضافة مقرر'}</h2><form class="form" id="acadd" style="border:0;margin:0;padding:0">
        <label>البرنامج<select id="ac-nprog"${ce ? ' disabled' : ''}>${progOpts(ce ? ce.programId : A.program)}</select></label>
        <div class="two"><label>السنة الدراسية<select id="ac-nlvl">${lvlOpts(ce ? ce.level : (A.level || 1), false, ce ? ce.programId : A.program)}</select></label><label>الفصل<select id="ac-nsem"><option value="1"${ce && ce.semester === 1 ? ' selected' : ''}>الأول</option><option value="2"${ce && ce.semester === 2 ? ' selected' : ''}>الثاني</option></select></label></div>
        <label>اسم المقرر<input id="ac-nname" maxlength="100" required value="${ce ? esc(ce.name) : ''}"></label>
        <div class="two"><label>الساعات<input id="ac-nhours" type="number" min="0" max="12" value="${ce ? ce.hours : 3}"></label><label>الرمز (اختياري)<input id="ac-ncode" maxlength="20" dir="ltr" value="${ce ? esc(ce.code || '') : ''}"></label></div>
        <label>المدرّس (اختياري)<input id="ac-ninst" maxlength="80" value="${ce ? esc(ce.instructor || '') : ''}"></label>
        <div class="actions" style="margin:0"><button class="btn pri" type="submit">${ce ? 'حفظ التعديل' : 'إضافة المقرر'}</button>${ce ? '<button class="btn" type="button" data-act="acecancel">إلغاء</button>' : ''}</div></form></section></div>`;
  }
  function gradesTab() {
    const found = A.gres ? `<ul class="mini-list">${A.gres.length ? A.gres.map((s) => `<li><button class="link" data-act="acpick" data-id="${s.id}">${esc(s.name)} · <span class="mono">${esc(s.studentNo)}</span></button> <span class="small">${esc(s.program.name)} · ${esc(s.levelLabel)}</span></li>`).join('') : '<li class="empty">لا نتائج.</li>'}</ul>` : '';
    let right = '<div class="empty">ابحث عن طالب ثم اخترْه لإدخال علاماته.</div>';
    if (A.gs) {
      const g = A.gdata;
      const rows = g.grades.map((x) => `<tr><td>${esc(x.course)}</td><td>${lvl(x.level)} · ${sem(x.semester)}</td><td>${esc(x.academicYear || '')}</td><td>${x.theory ?? '—'}</td><td>${x.practical ?? '—'}</td><td><b>${x.total}</b></td><td><span class="pill ${x.passed ? 'p-approved' : 'p-rejected'}">${x.passed ? 'ناجح' : 'راسب'}</span>${x.previous.length ? ` <span class="small">(+${x.previous.length} سابقة)</span>` : ''}</td><td style="white-space:nowrap"><button class="btn sm" data-act="gredit" data-cid="${x.courseId ?? ''}" data-y="${esc(x.academicYear || '')}" data-th="${x.theory ?? ''}" data-pr="${x.practical ?? ''}">تعديل</button> <button class="btn sm bad" data-act="grdel" data-id="${x.id}">حذف</button></td></tr>`).join('');
      right = `<div class="me"><div class="avatar">${esc(A.gs.name[0])}</div><div><b>${esc(A.gs.name)}</b><small class="mono">${esc(A.gs.studentNo)} · ${esc(A.gs.program.name)} · ${esc(A.gs.levelLabel)}</small></div></div>
        ${A.gerr ? `<div class="err" role="alert" style="margin-top:12px">${esc(A.gerr)}</div>` : ''}
        <form class="form" id="acgrade"><label>المقرر<select id="gr-course" required><option value="">— اختر —</option>${A.gcourses.map((c) => `<option value="${c.id}">${lvl(c.level)} · ${sem(c.semester)} — ${esc(c.name)}</option>`).join('')}</select></label>
          <div class="two"><label>العام الدراسي<input id="gr-year" value="${defYear()}" dir="ltr" pattern="\\d{4}/\\d{4}" required></label><span></span></div>
          <div class="two"><label>العلامة النظرية<input id="gr-th" type="number" min="0" max="100" required></label><label>العلامة العملية<input id="gr-pr" type="number" min="0" max="100"></label></div>
          <div class="small">مجموع العلامتين لا يتجاوز 100، والنجاح من ${g.passMark}. إعادة إدخال العلامة لنفس المقرر والعام تعدّلها (ويُسجَّل ذلك).</div>
          <div class="actions" style="margin:0"><button class="btn pri" type="submit">حفظ العلامة</button></div></form>
        <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>المقرر</th><th>السنة/الفصل</th><th>العام</th><th>نظري</th><th>عملي</th><th>المجموع</th><th>الحالة</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="empty">لا علامات مسجَّلة.</td></tr>'}</tbody></table></div>`;
    }
    return `<div class="grid2"><section class="card"><h2>اختيار الطالب</h2><form class="inline-form" id="acsearch"><label>بحث<input id="ac-q" value="${esc(A.gq)}" placeholder="اسم أو رقم جامعي" maxlength="60"></label><button class="btn pri" type="submit">بحث</button></form>${found}</section>
      <section class="card"><h2>إدخال العلامات</h2>${right}</section></div>`;
  }
  UA.views.academics = () => bar([['courses', 'دليل المواد'], ['grades', 'إدخال العلامات']], A.tab, 'actab') + (A.tab === 'courses' ? coursesTab() : gradesTab());

  async function pickStudent(id) {
    A.gs = (await api('GET', '/api/students/' + id)).student; A.gerr = '';
    [A.gdata, A.gcourses] = await Promise.all([api('GET', `/api/students/${id}/grades`), api('GET', '/api/courses?program=' + A.gs.program.id).then((r) => r.courses.filter((c) => c.active))]);
  }
  Object.assign(UA.actions, {
    actab: async (el, d) => { A.tab = d.t; UA.render(); },
    actoggle: async (el, d) => { await api('POST', `/api/courses/${d.id}/toggle`, { enabled: d.on === '1' }); await loadCourses(); UA.render(); },
    acpick: async (el, d) => { await pickStudent(d.id); UA.render(); },
    acedit: async (el, d) => { A.cedit = Number(d.id); UA.render(); window.scrollTo(0, 0); },
    acecancel: async () => { A.cedit = null; UA.render(); },
    acdel: async (el, d) => {
      const c = A.courses.find((x) => x.id === Number(d.id)); if (!c || !confirm(`حذف المقرر «${c.name}» نهائياً؟ (لا يُقبل الحذف إن كانت له علامات مسجَّلة)`)) return;
      try { await api('DELETE', '/api/courses/' + d.id); if (A.cedit === c.id) A.cedit = null; await loadCourses(); UA.render(); toast('حُذف المقرر'); } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    gredit: async (el, d) => {                      // يملأ نموذج الإدخال: الحفظ لنفس المقرر والعام يعدّل العلامة
      if (!d.cid) { toast('علامة قديمة غير مرتبطة بمقرر؛ يمكن حذفها فقط'); return; }
      document.getElementById('gr-course').value = d.cid; document.getElementById('gr-year').value = d.y; document.getElementById('gr-th').value = d.th; document.getElementById('gr-pr').value = d.pr;
      document.getElementById('acgrade').scrollIntoView({ block: 'center' }); document.getElementById('gr-th').focus();
    },
    grdel: async (el, d) => {
      if (!confirm('حذف هذه العلامة نهائياً؟')) return;
      try { A.gdata = await api('DELETE', `/api/students/${A.gs.id}/grades/${d.id}`); A.gerr = ''; UA.render(); toast('حُذفت العلامة'); } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
  });
  Object.assign(UA.forms, {
    acfilter: async () => { A.program = val('ac-prog'); A.level = val('ac-lvl'); await loadCourses(); UA.render(); },
    acadd: async () => {
      const programId = Number(val('ac-nprog'));
      try {
        const body = { level: Number(val('ac-nlvl')), semester: Number(val('ac-nsem')), name: val('ac-nname'), hours: Number(val('ac-nhours')), code: val('ac-ncode'), instructor: val('ac-ninst') };
        if (A.cedit) { await api('PUT', '/api/courses/' + A.cedit, body); A.cedit = null; await loadCourses(); UA.render(); toast('حُفظ تعديل المقرر'); return; }
        await api('POST', '/api/courses', { programId, ...body });
        A.program = String(programId); await loadCourses(); UA.render(); toast('أُضيف المقرر');
      } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    acsearch: async () => { A.gq = val('ac-q').trim(); A.gres = (await api('GET', '/api/students?' + new URLSearchParams({ q: A.gq }))).students.slice(0, 10); UA.render(); },
    acgrade: async () => {
      try {
        A.gdata = await api('POST', `/api/students/${A.gs.id}/grades`, { courseId: Number(val('gr-course')), academicYear: val('gr-year'), theory: val('gr-th'), practical: val('gr-pr') });
        A.gerr = ''; UA.render(); toast('حُفظت العلامة');
      } catch (e) { if (!e.status) throw e; A.gerr = e.message; UA.render(); }
    },
  });

  /* ---------- الأخبار والشكاوى ---------- */
  const CST = { open: ['p-review', 'قيد المعالجة'], answered: ['p-approved', 'تم الرد'], closed: ['p-approved', 'مغلقة'] };
  UA.loaders.comms = async () => {
    const q = A.cfilter === 'all' ? '' : '?status=' + A.cfilter;
    [A.news, A.cmps] = await Promise.all([api('GET', '/api/news').then((r) => r.news), api('GET', '/api/complaints' + q).then((r) => r.complaints)]);
  };
  function newsTab() {
    const ne = A.nedit ? A.news.find((n) => n.id === A.nedit) : null;
    return `<div class="grid2"><section class="card"><h2>${ne ? 'تعديل خبر' : 'نشر خبر'}</h2><form class="form" id="newsadd" style="border:0;margin:0;padding:0"><label>العنوان<input id="nw-title" maxlength="150" required value="${ne ? esc(ne.title) : ''}"></label>
        <label>النص<textarea id="nw-body" rows="5" maxlength="4000" required>${ne ? esc(ne.body) : ''}</textarea></label>${ne ? '<p class="small">لإضافة صور أو روابط أو حذفها استخدم الخبر في القائمة المجاورة.</p>' : `<label>صور أو فيديو (رفع مباشر)<input id="nw-files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"></label>
        <label>روابط (رابط في كل سطر)<textarea id="nw-links" rows="3" dir="ltr" placeholder="https://youtu.be/...&#10;https://example.com/photo.jpg"></textarea></label>
        <p class="small">الرفع: صور حتى 5 ميغابايت (jpg/png/webp/gif) وفيديو حتى 50 ميغابايت (mp4/webm). الروابط: صورة أو فيديو مباشر (https) أو يوتيوب أو فيميو. حتى 8 وسائط للخبر.</p>
        `}<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="nw-pin" type="checkbox" style="width:auto"${ne && ne.pinned ? ' checked' : ''}> تثبيت في أعلى القائمة</label>
        <div class="actions" style="margin:0"><button class="btn pri" type="submit">${ne ? 'حفظ التعديل' : 'نشر'}</button>${ne ? '<button class="btn" type="button" data-act="newscancel">إلغاء</button>' : ''}</div></form></section>
      <section class="card"><h2>الأخبار المنشورة <span class="small">(${A.news.length})</span></h2>${A.news.length ? A.news.map((n) => `<article class="req"><div class="req-h"><b>${n.pinned ? UA.icon('pin', 16) + ' ' : ''}${esc(n.title)}</b><span style="white-space:nowrap"><button class="btn sm" data-act="newsedit" data-id="${n.id}">تعديل</button> <button class="btn sm bad" data-act="newsdel" data-id="${n.id}">حذف</button></span></div><div class="no">${fmt(n.publishedAt)}</div><div class="hint" style="white-space:pre-wrap">${esc(n.body.length > 220 ? n.body.slice(0, 220) + '…' : n.body)}</div>
        ${n.media.length ? `<div class="news-media compact">${n.media.map((m) => `<figure>${UA.mediaHtml([m], { compact: true }).replace(/^<div[^>]*>|<\/div>$/g, '')}<button class="btn sm bad" data-act="nmdel" data-id="${m.id}">حذف</button></figure>`).join('')}</div>` : ''}
        <div class="inline-form" style="margin-top:8px"><label>إضافة ملف<input type="file" id="nm-f-${n.id}" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"></label><button class="btn sm" data-act="nmup" data-id="${n.id}">رفع</button><button class="btn sm" data-act="nmlink" data-id="${n.id}">إضافة رابط</button></div></article>`).join('') : '<div class="empty">لا أخبار بعد. ما تنشره يظهر لكل الطلاب في تطبيقهم.</div>'}</section></div>`;
  }
  function complaintsTab() {
    const fl = [['open', 'قيد المعالجة'], ['answered', 'تم الرد'], ['closed', 'مغلقة'], ['all', 'الكل']];
    const sel = A.cmps.find((c) => c.id === A.csel);
    const rows = A.cmps.map((c) => `<tr class="row" tabindex="0" data-act="cmpsel" data-id="${c.id}" aria-selected="${A.csel === c.id}"><td>${esc(c.subject)}</td><td>${esc(c.student.name)}</td><td><span class="pill ${CST[c.status][0]}">${CST[c.status][1]}</span></td><td class="hint" style="white-space:nowrap">${fmt(c.createdAt)}</td></tr>`).join('');
    const det = sel ? `<dl class="kv"><dt>الرقم</dt><dd class="mono">${esc(sel.no)}</dd><dt>الطالب</dt><dd>${esc(sel.student.name)} · ${esc(sel.student.studentNo)}</dd><dt>الموضوع</dt><dd>${esc(sel.subject)}</dd><dt>النص</dt><dd style="white-space:pre-wrap">${esc(sel.body)}</dd>${sel.response ? `<dt>الرد</dt><dd style="white-space:pre-wrap">${esc(sel.response)}</dd>` : ''}</dl>
      ${sel.status !== 'closed' ? `<form class="form" id="cmpresp"><label>${sel.response ? 'رد إضافي' : 'الرد على الطالب'}<textarea id="cm-resp" rows="3" maxlength="1000" required></textarea></label><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="cm-close" type="checkbox" style="width:auto"> إغلاق الشكوى بعد الرد</label><div class="actions" style="margin:0"><button class="btn pri" type="submit">إرسال الرد</button></div></form>` : ''}` : '<div class="empty">اختر شكوى من القائمة.</div>';
    return `<div class="grid2"><section class="card"><h2>الشكاوى</h2><div class="chips">${fl.map((f) => `<button class="chip" data-act="cmpflt" data-f="${f[0]}" aria-pressed="${A.cfilter === f[0]}">${f[1]}</button>`).join('')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>الموضوع</th><th>الطالب</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">لا شكاوى في هذا التصنيف.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>تفاصيل الشكوى</h2>${det}${sel ? `<div class="actions no-print"><button class="btn bad" data-act="cmpdel" data-id="${sel.id}">حذف الشكوى</button></div>` : ''}</section></div>`;
  }
  UA.views.comms = () => bar([['news', 'الأخبار'], ['complaints', 'الشكاوى']], A.ctab || 'news', 'cmtab') + ((A.ctab || 'news') === 'news' ? newsTab() : complaintsTab());
  Object.assign(UA.actions, {
    cmtab: async (el, d) => { A.ctab = d.t; UA.render(); },
    cmpflt: async (el, d) => { A.cfilter = d.f; A.csel = null; await UA.loaders.comms(); UA.render(); },
    cmpsel: async (el, d) => { A.csel = Number(d.id); UA.render(); },
    nmdel: async (el, d) => { if (!confirm('حذف هذا الوسيط؟')) return; try { await api('DELETE', '/api/news/media/' + d.id); await UA.loaders.comms(); UA.render(); } catch (e) { if (!e.status) throw e; toast(e.message); } },
    nmup: async (el, d) => { const fl = document.getElementById('nm-f-' + d.id).files[0]; if (!fl) { toast('اختر ملفاً'); return; } try { await UA.upload(`/api/news/${d.id}/media`, fl); await UA.loaders.comms(); UA.render(); toast('أُضيف الملف'); } catch (e) { if (!e.status) throw e; toast(e.message); } },
    nmlink: async (el, d) => { const u = prompt('الصق الرابط (صورة/فيديو مباشر، يوتيوب، فيميو)'); if (!u) return; try { await api('POST', `/api/news/${d.id}/links`, { url: u }); await UA.loaders.comms(); UA.render(); toast('أُضيف الرابط'); } catch (e) { if (!e.status) throw e; toast(e.message); } },
    newsedit: async (el, d) => { A.nedit = Number(d.id); UA.render(); window.scrollTo(0, 0); },
    newscancel: async () => { A.nedit = null; UA.render(); },
    cmpdel: async (el, d) => {
      const c = A.cmps.find((x) => x.id === Number(d.id)); if (!c || !confirm(`حذف الشكوى ${c.no} نهائياً؟`)) return;
      try { await api('DELETE', '/api/complaints/' + d.id); A.csel = null; await UA.loaders.comms(); UA.render(); toast('حُذفت الشكوى'); } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    newsdel: async (el, d) => { if (!confirm('حذف هذا الخبر نهائياً؟')) return; await api('DELETE', '/api/news/' + d.id); await UA.loaders.comms(); UA.render(); toast('حُذف الخبر'); },
  });
  Object.assign(UA.forms, {
    newsadd: async () => {
      try {
        if (A.nedit) { await api('PUT', '/api/news/' + A.nedit, { title: val('nw-title'), body: val('nw-body'), pinned: document.getElementById('nw-pin').checked }); A.nedit = null; await UA.loaders.comms(); UA.render(); toast('حُفظ تعديل الخبر'); return; }
        const files = [...document.getElementById('nw-files').files], links = val('nw-links').split(/\n/).map((x) => x.trim()).filter(Boolean);
        for (const fl of files) if (fl.size > (fl.type.startsWith('video/') ? 50 : 5) * 1048576) { toast(`الملف «${fl.name}» أكبر من الحد المسموح`); return; }
        const r = await api('POST', '/api/news', { title: val('nw-title'), body: val('nw-body'), pinned: document.getElementById('nw-pin').checked, links });
        const failed = [];
        for (const fl of files) { try { await UA.upload(`/api/news/${r.id}/media`, fl); } catch (e) { if (!e.status) throw e; failed.push(`${fl.name}: ${e.message}`); } }
        await UA.loaders.comms(); UA.render();
        toast(failed.length ? `نُشر الخبر، وتعذّر رفع: ${failed.join(' | ')}` : 'نُشر الخبر');
      } catch (e) { if (!e.status) throw e; toast(e.message); }
    },
    cmpresp: async () => {
      try { await api('POST', `/api/complaints/${A.csel}/respond`, { response: val('cm-resp'), close: document.getElementById('cm-close').checked }); await UA.loaders.comms(); UA.render(); toast('أُرسل الرد'); }
      catch (e) { if (!e.status) throw e; toast(e.message); }
    },
  });
})();
</script>
<script>/* واجهة الطالب بنمط تطبيق الجوال: الرئيسية، دليل المواد، علاماتي، الأخبار، معاملاتي + قائمة الملف الشخصي */
(function () {
  const UA = window.UA, { S, api, esc, fmt, val, toast } = UA;
  const LV = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة'];
  const GOV = ['دمشق', 'ريف دمشق', 'حلب', 'حمص', 'حماة', 'اللاذقية', 'طرطوس', 'إدلب', 'درعا', 'السويداء', 'القنيطرة', 'دير الزور', 'الرقة', 'الحسكة', 'خارج سوريا'];
  const SEM_LABEL = { 1: 'الفصل الأول', 2: 'الفصل الثاني' };
  const day = (t) => { try { return new Date(t).toLocaleDateString('ar-EG-u-nu-latn', { dateStyle: 'medium' }); } catch { return ''; } };

  const T = { profile: null, news: null, courses: null, grades: null, reqs: null, cmps: null, loading: {},
    guide: { level: null, sem: '' }, gr: { level: null, sem: '', open: {} }, openReq: {}, wz: null, error: '' };
  UA.reset = () => Object.assign(T, { profile: null, news: null, courses: null, grades: null, reqs: null, cmps: null, loading: {}, guide: { level: null, sem: '' }, gr: { level: null, sem: '', open: {} }, openReq: {}, wz: null });

  /* ---------- أيقونات ---------- */
  // الأيقونات من المجموعة الموحّدة بهوية الجامعة (public/icons.js)
  const IC = Object.fromEntries(['home', 'guide', 'grades', 'news', 'tx', 'cap', 'doc', 'bed', 'back', 'plus', 'out', 'edit', 'lock', 'help', 'shield'].map((k) => [k, UA.icon(k === 'doc' ? 'tx' : k)]));
  IC.check = UA.icon('check', 16); IC.cross = UA.icon('cross', 16);
  const svcIcon = (c) => ({ transcript: IC.doc, excellence_year: IC.cap, campus_life: IC.bed }[c] || IC.doc);
  const emblem = `<img class="emblem" src="${window.__CREST}" alt="شعار الجامعة" width="87" height="104">`;

  /* ---------- مكونات ---------- */
  const sk = (n = 5) => Array.from({ length: n }, () => '<div class="sk-card"><i class="sk-l w60"></i><i class="sk-l w40"></i></div>').join('');
  const pageHead = (title, extra = '') => `<header class="m-head"><h1>${esc(title)}</h1>${extra}</header>`;
  const empty = (t, d) => `<div class="m-empty"><b>${esc(t)}</b>${d ? `<p>${esc(d)}</p>` : ''}</div>`;
  const years = () => (T.profile && T.profile.program && T.profile.program.years) || 4;
  const curLevel = () => (T.profile ? T.profile.level : 1);
  const levelChips = (act, cur) => `<div class="m-chips" role="tablist">${Array.from({ length: years() }, (_, i) => i + 1).map((n) => `<button class="m-chip" role="tab" data-act="${act}" data-l="${n}" aria-selected="${cur === n}">السنة ${LV[n - 1] || n}</button>`).join('')}</div>`;
  const semSelect = (id, cur) => `<div class="m-sort"><span>ترتيب حسب</span><select data-chg="${id}" aria-label="الفصل الدراسي"><option value=""${cur === '' ? ' selected' : ''}>الفصلين معاً</option><option value="1"${cur === '1' ? ' selected' : ''}>الفصل الأول</option><option value="2"${cur === '2' ? ' selected' : ''}>الفصل الثاني</option></select></div>`;

  /* ---------- الصفحات ---------- */
  function homePage() {
    const h = new Date().getHours(), hello = h < 12 ? 'صباح الخير' : 'مساء الخير';
    const news = T.news ? (T.news.length ? `<div class="m-car" tabindex="0" aria-label="أبرز الأخبار">${T.news.slice(0, 8).map((n) => `<button class="m-news-c" data-act="newsopen" data-id="${n.id}"><span class="d">${esc(day(n.publishedAt))}</span><b>${esc(n.title)}</b></button>`).join('')}</div>` : '<div class="m-empty small-e">لا أخبار حالياً.</div>') : '<div class="m-car">' + sk(1) + '</div>';
    const order = { excellence_year: 1, campus_life: 2, transcript: 3, attendance: 4, excuse: 5 };
    const svcs = [...S.services].sort((a, b) => (order[a.code] || 9) - (order[b.code] || 9));
    const cards = svcs.map((s, i) => `<button class="m-svc${svcs.length % 2 && i === 0 ? ' wide' : ''}" data-act="wzstart" data-k="${esc(s.code)}"><span class="ic">${svcIcon(s.code)}</span><b>${esc(s.label)}</b></button>`).join('');
    return `<header class="m-hello"><button class="m-avatar" data-act="drawer" aria-label="الملف الشخصي"><span>${esc(S.me.name[0])}</span></button><div><small>${hello}</small><b>${esc(S.me.name)}</b></div></header>
      <section><div class="m-sec"><h2>أبرز الأخبار</h2><button class="link" data-act="snav" data-v="news">عرض الكل</button></div>${news}</section>
      <section><div class="m-sec"><h2>المعاملات</h2></div><div class="m-svcs">${cards}</div></section>`;
  }
  function guidePage() {
    const lv = T.guide.level || curLevel();
    let body;
    if (T.loading.guide || !T.courses) body = sk(6);
    else if (!T.courses.length) body = empty('لا توجد مقررات مسجَّلة لهذه السنة بعد', 'تُضاف المقررات من قسم شؤون الطلاب.');
    else body = T.courses.map((c) => `<article class="m-card"><b>${esc(c.name)} - ${SEM_LABEL[c.semester]}</b><small>${esc(c.instructor || 'المدرّس غير محدد')}</small></article>`).join('');
    return pageHead('دليل المواد') + levelChips('glvl', lv) + semSelect('gsem', T.guide.sem) + `<div class="m-list">${body}</div>`;
  }
  function gradeCard(g) {
    const open = T.gr.open[g.id], badge = g.passed ? `<span class="m-badge ok">${IC.check}ناجح</span>` : `<span class="m-badge bad">${IC.cross}راسب</span>`;
    const marks = (x) => `<div class="m-marks">${x.theory !== null ? `<span>علامة الامتحان النظري <b>${x.theory}</b></span>` : ''}${x.practical !== null ? `<span>علامة الامتحان العملي <b>${x.practical}</b></span>` : ''}<span>العلامة الكلية <b>${x.total}</b></span></div>`;
    const prev = g.previous.length ? `<button class="m-prev" data-act="gprev" data-id="${g.id}" aria-expanded="${!!open}"><span>عرض العلامات السابقة</span>${IC.back}</button>` : '';
    const prevList = open ? g.previous.map((p) => `<div class="m-prevrow"><small>${esc(p.academicYear || '')}</small>${marks(p)}</div>`).join('') : '';
    return `<article class="m-card g">${badge}<b>${esc(g.course)} - ${SEM_LABEL[g.semester] || ''}</b>${g.instructor ? `<small>${esc(g.instructor)}</small>` : ''}<hr>${marks(g)}${prev}${prevList}</article>`;
  }
  function gradesPage() {
    const lv = T.gr.level || curLevel();
    let body;
    if (T.loading.grades || !T.grades) body = sk(4);
    else {
      let list = T.grades.grades; if (T.gr.sem) list = list.filter((g) => String(g.semester) === T.gr.sem);
      const sm = T.grades.summary;
      const sum = sm.count ? `<div class="m-sum"><div><b>${sm.count}</b><small>مقرراً</small></div><div class="ok"><b>${sm.passed}</b><small>ناجح</small></div><div class="bad"><b>${sm.failed}</b><small>راسب</small></div><div><b>${sm.average ?? '—'}</b><small>المعدل</small></div></div>` : '';
      body = sum + (list.length ? list.map(gradeCard).join('') : empty('لا توجد علامات لهذه السنة بعد', 'تظهر العلامات هنا فور اعتمادها من شؤون الطلاب.'));
    }
    return pageHead('علاماتي') + levelChips('grlvl', lv) + semSelect('grsem', T.gr.sem) + `<div class="m-list">${body}</div>`;
  }
  function newsPage() {
    const body = !T.news ? sk(5) : (T.news.length ? T.news.map((n) => `<button class="m-news-r" data-act="newsopen" data-id="${n.id}"><span class="t"><small>${esc(day(n.publishedAt))}${n.pinned ? ' · ' + UA.icon('pin', 14) + ' مثبّت' : ''}</small><b>${esc(n.title)}</b><span class="ex">${esc(n.body.length > 90 ? n.body.slice(0, 90) + '…' : n.body)}</span></span>${(n.media.find((m) => m.kind === 'image') || {}).src ? `<img class="th" src="${esc(n.media.find((m) => m.kind === 'image').src)}" alt="" loading="lazy">` : (n.media.length ? '<span class="th vid-ic" aria-hidden="true">▶</span>' : '')}</button>`).join('') : empty('لا أخبار حالياً'));
    return pageHead('التعميمات والأخبار') + `<div class="m-list">${body}</div>`;
  }
  function reqCard(r) {
    const open = T.openReq[r.id], st = UA.pill(r);
    const det = open ? `<div class="m-det"><div class="hint">${esc(UA.detailsText(r))}</div>${UA.steps(r)}${r.status === 'rejected' ? `<div class="reason">سبب الرفض: ${esc(r.rejectReason)}</div>` : ''}
      ${r.document ? `<div class="actions"><button class="btn pri sm" data-act="doc" data-c="${esc(r.document.code)}">عرض الوثيقة</button><span class="hint" style="align-self:center">رمز التحقق: <span class="mono">${esc(r.document.code)}</span></span></div>` : ''}${UA.events(r)}</div>` : '';
    return `<article class="m-card r"><button class="m-reqh" data-act="reqtoggle" data-id="${r.id}" aria-expanded="${!!open}"><span><b>${esc(r.service.label)}</b><small>${esc(r.no)} · ${fmt(r.createdAt)}</small></span>${st}</button>${det}</article>`;
  }
  function txPage() {
    let body;
    if (!T.reqs) body = sk(4);
    else if (!T.reqs.length) body = `<div class="m-empty big"><b>لا يوجد معاملات سابقة لك</b><p>إذا كنت ترغب في الحصول على معاملة جديدة وبسهولة مطلقة، ما عليك إلا أن تبدأ بإنشاء واحدة الآن</p><button class="m-btn" data-act="wzstart">إنشاء معاملة جديدة ${IC.plus}</button></div>`;
    else body = T.reqs.map(reqCard).join('');
    return pageHead('المعاملات', `<button class="btn pri sm m-newtx" data-act="wzstart">${IC.plus}<span>إنشاء معاملة جديدة</span></button>`) + `<div class="m-list">${body}</div><button class="m-fab" data-act="wzstart" aria-label="إنشاء معاملة جديدة">${IC.plus}</button>`;
  }

  /* ---------- الهيكل العام ---------- */
  UA.studentShell = function () {
    const nav = UA.viewsFor ? UA.viewsFor('student') : [['home', 'الرئيسية'], ['guide', 'دليل المواد'], ['grades', 'علاماتي'], ['news', 'الأخبار'], ['tx', 'معاملاتي']];
    let page;
    if (S.view === 'verify') page = `<div class="m-verify"><button class="m-back" data-act="snav" data-v="home" aria-label="رجوع">${IC.back}<span>رجوع</span></button>${UA.verifyView()}</div>`;
    else page = ({ home: homePage, guide: guidePage, grades: gradesPage, news: newsPage, tx: txPage }[S.view] || homePage)();
    const act = S.view === 'verify' ? 'home' : S.view;
    if (!UA.isMobile()) {                       // الحاسوب: ترويسة الموقع المعتادة وصفحات بعرض كامل بدل الشريط السفلي
      const tabs = nav.map(([k, l]) => `<button class="tab" role="tab" data-act="snav" data-v="${k}" aria-selected="${act === k}">${UA.icon(k, 18)}<span>${l}</span></button>`).join('');
      return `<header class="top"><div class="wrap"><div class="brand"><img class="crest" src="${window.__CREST}" alt="" width="40" height="48"><div class="t"><b>بوابة خدمات الطلاب</b><span>${esc(S.uni)} · قسم شؤون الطلاب</span></div></div>
        <div class="tabs" role="tablist">${tabs}</div><div class="who"><span><b>${esc(S.me.name)}</b></span><button class="btn sm" data-act="drawer">${UA.icon('edit', 16)}<span>الملف الشخصي</span></button><button class="btn sm" data-act="logout">خروج</button></div></div></header>
        <div class="wrap m-desk"><main class="m-main">${page}</main></div>${UA.siteFoot()}`;
    }
    return `<div class="m-app"><main class="m-main">${page}</main><nav class="m-nav" aria-label="التنقل الرئيسي">${nav.map(([k, l]) => `<button data-act="snav" data-v="${k}" aria-current="${act === k ? 'page' : 'false'}">${IC[{ home: 'home', guide: 'guide', grades: 'grades', news: 'news', tx: 'tx' }[k]]}<span>${l}</span></button>`).join('')}</nav></div>`;
  };

  /* ---------- تحميل البيانات ---------- */
  async function ensureProfile() { if (!T.profile) T.profile = (await api('GET', '/api/me/profile')).profile; }
  const L = {
    home: async () => { const [n] = await Promise.all([api('GET', '/api/news'), ensureProfile()]); T.news = n.news; },
    guide: async () => { await ensureProfile(); const lv = T.guide.level || curLevel(); T.courses = (await api('GET', `/api/courses?level=${lv}${T.guide.sem ? '&semester=' + T.guide.sem : ''}`)).courses; },
    grades: async () => { await ensureProfile(); const lv = T.gr.level || curLevel(); T.grades = await api('GET', '/api/me/grades?level=' + lv); },
    news: async () => { T.news = (await api('GET', '/api/news')).news; },
    tx: async () => { T.reqs = (await api('GET', '/api/requests')).requests; },
  };
  Object.keys(L).forEach((k) => { UA.loaders[k] = L[k]; });
  async function open(view) {            // يعرض الهيكل فوراً (هياكل تحميل) ثم يملؤه
    S.view = view; T.loading[view] = true; UA.render(); window.scrollTo(0, 0);
    try { await L[view](); } catch (e) { if (e.status !== 401) toast(e.message); }
    T.loading[view] = false; if (S.view === view) UA.render();
  }

  /* ---------- نوافذ كاملة الشاشة ---------- */
  const layer = () => document.getElementById('layer');
  const close = () => { layer().innerHTML = ''; T.wz = null; };
  const sheet = (title, body, { back = 'close', foot = '' } = {}) => { layer().innerHTML = `<div class="m-full" dir="rtl" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-full-in"><header class="m-fh"><h2>${esc(title)}</h2><button class="m-back" data-act="${back}" aria-label="رجوع">${IC.back}</button></header><div class="m-fb">${body}</div>${foot ? `<footer class="m-ff">${foot}</footer>` : ''}</div></div>`; };

  // --- معاملة جديدة (3 خطوات) ---
  function fieldHtml(f, v) {
    const id = 'wz-' + f.name, req = f.required ? ' required' : '', cur = v ?? f.default ?? '';
    let c;
    if (f.type === 'select') c = `<select id="${id}"${req}><option value="">— اختر —</option>${f.options.map((o) => `<option${o === cur ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'number') c = `<input id="${id}" type="number" min="${f.min ?? 0}" max="${f.max ?? 99}" value="${esc(cur)}"${req}>`;
    else if (f.type === 'date') c = `<input id="${id}" type="date" value="${esc(cur)}"${req}>`;
    else c = `<input id="${id}" type="text" maxlength="200" value="${esc(cur)}"${req}>`;
    return `<label>${esc(f.label)}${f.required ? ' <i class="req-m">*</i>' : ''}${c}</label>`;
  }
  const svcOf = () => S.services.find((s) => s.code === T.wz.k);
  function drawWizard() {
    const w = T.wz, step = w.step;
    if (step === 1) {
      const order = { excellence_year: 1, campus_life: 2, transcript: 3, attendance: 4, excuse: 5 };
      const svcs = [...S.services].sort((a, b) => (order[a.code] || 9) - (order[b.code] || 9));
      sheet('المعاملات', `<p class="m-lead">حدد نوع المعاملة المطلوب إنشائها.</p><div class="m-emblem">${emblem}</div><div class="m-svcs">${svcs.map((s, i) => `<button class="m-svc${svcs.length % 2 && i === 0 ? ' wide' : ''}" data-act="wzpick" data-k="${esc(s.code)}"><span class="ic">${svcIcon(s.code)}</span><b>${esc(s.label)}</b></button>`).join('')}</div>`, { foot: '<span>الخطوة 1/3</span>' });
    } else if (step === 2) {
      const s = svcOf();
      sheet(s.label, `<form id="wzform" class="m-form"><p class="m-lead">${esc(s.description)}</p>${s.fields.map((f) => fieldHtml(f, w.vals[f.name])).join('')}
        ${s.requiresAttachment ? `<label>المرفق (PDF أو صورة، حتى 2 ميغابايت) <i class="req-m">*</i><input id="wz-file" type="file" accept=".pdf,.png,.jpg,.jpeg"${w.file ? '' : ' required'}>${w.file ? `<span class="small">المرفق الحالي: ${esc(w.file.name)}</span>` : ''}</label>` : ''}
        ${w.err ? `<div class="err" role="alert">${esc(w.err)}</div>` : ''}<button class="m-btn" type="submit">التالي</button></form>`, { back: 'wzback', foot: '<span>الخطوة 2/3</span>' });
    } else {
      const s = svcOf(), rows = s.fields.filter((f) => w.vals[f.name] !== '' && w.vals[f.name] !== undefined).map((f) => `<dt>${esc(f.label)}</dt><dd>${esc(w.vals[f.name])}</dd>`).join('');
      sheet('مراجعة وتأكيد', `<div class="m-form"><p class="m-lead">راجع بيانات معاملتك قبل التقديم.</p><dl class="kv"><dt>نوع المعاملة</dt><dd>${esc(s.label)}</dd>${rows}${w.file ? `<dt>المرفق</dt><dd>${esc(w.file.name)}</dd>` : ''}</dl>
        <p class="hint">يُجرى فحص آلي فوري، ثم يراجعها الموظف خلال ${s.slaHours} ساعة تقريباً.</p>${w.err ? `<div class="err" role="alert">${esc(w.err)}</div>` : ''}
        <button class="m-btn" data-act="wzsubmit"${w.busy ? ' disabled' : ''}>${w.busy ? 'جارٍ التقديم…' : 'تأكيد وتقديم المعاملة'}</button></div>`, { back: 'wzback', foot: '<span>الخطوة 3/3</span>' });
    }
  }
  const saveVals = () => { const s = svcOf(); s.fields.forEach((f) => { const e = document.getElementById('wz-' + f.name); if (e) T.wz.vals[f.name] = e.value; }); const fi = document.getElementById('wz-file'); if (fi && fi.files[0]) T.wz.file = fi.files[0]; };

  // --- القائمة الجانبية (الملف الشخصي) ---
  async function drawDrawer() {
    await ensureProfile();
    const st = T.profile, p = st ? st.profile : {}, row = (k, v) => (v ? `<div class="m-kv"><small>${k}</small><b>${esc(v)}</b></div>` : '');
    const info = st ? [row('الاسم الأول', p.first_name), row('الاسم الأخير', p.last_name), row('اسم الأب الأول', p.father_name), row('اسم الأم', p.mother_name), row('تاريخ الميلاد', p.birth_date), row('الكلية', st.program.faculty),
      row('البرنامج', st.program.faculty === st.program.name ? st.program.degree : `${st.program.degree} ${st.program.name}`), row('العام الدراسي', st.levelLabel), row('الرقم الوزاري', p.ministerial_no), row('الرقم الجامعي', st.studentNo)].join('')
      : '<p class="hint">لا يوجد ملف شخصي مسجَّل لحسابك بعد. راجع قسم شؤون الطلاب.</p>';
    layer().innerHTML = `<div class="m-drawer-bd" data-act="close"><aside class="m-drawer" dir="rtl" role="dialog" aria-modal="true" aria-label="الملف الشخصي" data-stop="1"><header><div class="m-avatar big"><span>${esc(S.me.name[0])}</span></div><div><b>${esc(S.me.name)}</b><small dir="ltr">${esc((p.email) || S.me.username)}</small></div></header>
      <div class="m-info">${info}</div><nav class="m-acts"><button data-act="cmpopen">${IC.help}<span>إضافة شكوى جديدة</span></button><button data-act="acctopen">${IC.edit}<span>تعديل معلومات الحساب</span></button><button data-act="pwopen">${IC.lock}<span>تعديل كلمة المرور</span></button><button data-act="certdl">${IC.doc}<span>تنزيل شهادة التسجيل الموقَّعة (PDF)</span></button><button data-act="goverify2">${IC.shield}<span>التحقق من وثيقة</span></button><button class="out" data-act="logout">${IC.out}<span>تسجيل الخروج</span></button></nav></aside></div>`;
  }
  const CST = { open: ['p-review', 'قيد المعالجة'], answered: ['p-approved', 'تم الرد'], closed: ['p-approved', 'مغلقة'] };
  async function drawComplaints(err = '') {
    T.cmps = (await api('GET', '/api/complaints')).complaints;
    sheet('الشكاوى', `<form id="cmpform" class="m-form"><label>الموضوع<input id="cp-s" maxlength="120" required></label><label>نص الشكوى<textarea id="cp-b" rows="4" maxlength="2000" required placeholder="اشرح المشكلة بوضوح (10 أحرف على الأقل)"></textarea></label>${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}<button class="m-btn" type="submit">إرسال الشكوى</button></form>
      <h3 class="m-h3">شكاواي السابقة</h3>${T.cmps.length ? T.cmps.map((c) => `<article class="m-card"><span class="pill ${CST[c.status][0]}" style="float:inline-end">${CST[c.status][1]}</span><b>${esc(c.subject)}</b><small>${esc(c.no)} · ${fmt(c.createdAt)}</small><p class="hint" style="white-space:pre-wrap;margin:6px 0 0">${esc(c.body)}</p>${c.response ? `<div class="m-reply"><small>رد الجامعة</small><p style="white-space:pre-wrap;margin:2px 0 0">${esc(c.response)}</p></div>` : ''}</article>`).join('') : '<div class="m-empty small-e">لم تقدّم أي شكوى.</div>'}`);
  }
  function drawAccount(err = '') {
    const p = (T.profile && T.profile.profile) || {};
    sheet('تعديل معلومات الحساب', `<form id="acctform" class="m-form"><p class="m-lead">يمكنك تعديل بيانات الاتصال فقط. أما الاسم وبقية البيانات الشخصية فتُصحَّح من قسم شؤون الطلاب بالوثائق الرسمية.</p>
      <label>رقم الهاتف المحمول<input id="ac-phone" type="tel" dir="ltr" value="${esc(p.phone || '')}" required></label><label>البريد الإلكتروني<input id="ac-email" type="email" dir="ltr" value="${esc(p.email || '')}"></label>
      <label>محافظة السكن<select id="ac-gov" required>${GOV.map((g) => `<option${g === p.governorate ? ' selected' : ''}>${g}</option>`).join('')}</select></label><label>المدينة / المنطقة<input id="ac-city" value="${esc(p.city || '')}" required maxlength="60"></label>
      <label>العنوان التفصيلي<input id="ac-addr" value="${esc(p.address || '')}" required maxlength="200"></label><label>هاتف آخر للطوارئ<input id="ac-emer" type="tel" dir="ltr" value="${esc(p.emergency_phone || '')}"></label>
      ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}<button class="m-btn" type="submit">حفظ</button></form>`);
  }
  function drawPassword(err = '') {
    sheet('تعديل كلمة المرور', `<form id="pwform2" class="m-form"><label>كلمة المرور الحالية<input id="pw2-cur" type="password" autocomplete="current-password" required></label><label>كلمة المرور الجديدة<input id="pw2-new" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>تأكيد كلمة المرور الجديدة<input id="pw2-new2" type="password" autocomplete="new-password" minlength="10" required></label><div class="small">10 أحرف على الأقل، وتحوي حروفاً وأرقاماً.</div>${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}<button class="m-btn" type="submit">حفظ كلمة المرور</button></form>`);
  }
  function drawNews(id) {
    const n = (T.news || []).find((x) => x.id === Number(id)); if (!n) return;
    sheet('الخبر', `<article class="m-article"><small>${esc(fmt(n.publishedAt))}</small><h3>${esc(n.title)}</h3><p style="white-space:pre-wrap">${esc(n.body)}</p>${UA.mediaHtml(n.media)}</article>`);
  }

  /* ---------- الأحداث ---------- */
  Object.assign(UA.actions, {
    snav: async (el, d) => { close(); await open(d.v); },
    glvl: async (el, d) => { T.guide.level = Number(d.l); T.courses = null; await open('guide'); },
    grlvl: async (el, d) => { T.gr.level = Number(d.l); T.grades = null; T.gr.open = {}; await open('grades'); },
    gprev: async (el, d) => { T.gr.open[d.id] = !T.gr.open[d.id]; UA.render(); },
    reqtoggle: async (el, d) => { T.openReq[d.id] = !T.openReq[d.id]; UA.render(); },
    newsopen: async (el, d) => { drawNews(d.id); },
    drawer: async () => { await drawDrawer(); },
    cmpopen: async () => { await drawComplaints(); },
    acctopen: async () => { await ensureProfile(); drawAccount(); },
    pwopen: async () => { drawPassword(); },
    certdl: async () => {
      try {
        const res = await fetch('/api/me/certificate.pdf', { credentials: 'same-origin' });
        if (!res.ok) { let m = 'تعذّر تنزيل الشهادة.'; try { m = (await res.json()).message || m; } catch { /* */ } toast(m); return; }
        const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = `enrollment-${S.me.username}.pdf`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } catch { toast('تعذّر تنزيل الشهادة.'); }
    },
    goverify2: async () => { close(); S.view = 'verify'; UA.render(); window.scrollTo(0, 0); },
    close: async (el, d, e) => { if (el.classList.contains('m-drawer-bd') && e.target.closest('.m-drawer')) return; close(); },
    wzstart: async (el, d) => { T.wz = { step: d.k ? 2 : 1, k: d.k || null, vals: {}, file: null, err: '' }; drawWizard(); },
    wzpick: async (el, d) => { T.wz.k = d.k; T.wz.step = 2; T.wz.vals = {}; T.wz.file = null; T.wz.err = ''; drawWizard(); },
    wzback: async () => { saveVals(); T.wz.err = ''; if (T.wz.step === 3) T.wz.step = 2; else T.wz.step = 1; drawWizard(); },
    wzsubmit: async () => {
      const w = T.wz, s = svcOf(); if (w.busy) return;
      w.busy = true; w.err = ''; drawWizard();
      try {
        const details = {}; s.fields.forEach((f) => { if (w.vals[f.name] !== undefined && w.vals[f.name] !== '') details[f.name] = f.type === 'number' ? Number(w.vals[f.name]) : w.vals[f.name]; });
        const attachment = w.file ? { name: w.file.name, data: await UA.readFile(w.file) } : undefined;
        const r = await api('POST', '/api/requests', { service: s.code, details, attachment });
        close(); T.reqs = null; T.openReq = { [r.request.id]: true }; await open('tx');
        toast(r.request.status === 'rejected' ? 'رُفضت المعاملة آلياً: ' + r.request.rejectReason : 'تم تقديم المعاملة برقم ' + r.request.no);
      } catch (e) { w.busy = false; if (!e.status) throw e; w.err = e.message; drawWizard(); }
    },
  });
  Object.assign(UA.forms, {
    wzform: async () => {
      saveVals(); const s = svcOf(), w = T.wz;
      const miss = s.fields.find((f) => f.required && (w.vals[f.name] === undefined || w.vals[f.name] === ''));
      if (miss) { w.err = `الحقل «${miss.label}» مطلوب.`; drawWizard(); return; }
      if (s.requiresAttachment && !w.file) { w.err = 'هذه المعاملة تتطلب مرفقاً.'; drawWizard(); return; }
      w.err = ''; w.step = 3; drawWizard();
    },
    cmpform: async () => {
      try { await api('POST', '/api/complaints', { subject: val('cp-s'), body: val('cp-b') }); await drawComplaints(); toast('أُرسلت الشكوى'); }
      catch (e) { if (!e.status) throw e; await drawComplaints(e.message); }
    },
    acctform: async () => {
      try { T.profile = (await api('PUT', '/api/me/profile', { phone: val('ac-phone'), email: val('ac-email'), governorate: val('ac-gov'), city: val('ac-city'), address: val('ac-addr'), emergency_phone: val('ac-emer') })).profile; close(); toast('حُفظت المعلومات'); }
      catch (e) { if (!e.status) throw e; drawAccount(e.message); }
    },
    pwform2: async () => {
      if (val('pw2-new') !== val('pw2-new2')) { drawPassword('تأكيد كلمة المرور غير مطابق.'); return; }
      try { await api('POST', '/api/auth/change-password', { current: val('pw2-cur'), next: val('pw2-new') }); close(); toast('تم تغيير كلمة المرور'); }
      catch (e) { if (!e.status) throw e; drawPassword(e.message); }
    },
  });
  const CHG = {
    gsem: async (el) => { T.guide.sem = el.value; T.courses = null; await open('guide'); },
    grsem: async (el) => { T.gr.sem = el.value; UA.render(); },
  };
  document.addEventListener('change', (e) => { const el = e.target.closest && e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) UA.guard(() => CHG[el.dataset.chg](el)); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { T.wz = null; } });
})();
</script>
<script>/* الاستيراد من Excel / CSV / SQL: طلاب، مقررات، علامات. فحص بلا حفظ ثم اعتماد. */
(function () {
  const UA = window.UA, { S, api, esc, toast, can } = UA;
  const KINDS = [
    { k: 'students', perm: 'student:register', title: 'الطلاب', tpl: '/templates/students-template.xlsx', desc: 'أسماء الطلاب وبياناتهم الكاملة. يُولَّد لكل طالب اسم مستخدم بترميز الكلية (مثل CCS-2026-0001) وكلمة مرور مؤقتة تُسلَّم في ملف منفصل مرة واحدة.' },
    { k: 'courses', perm: 'course:manage', title: 'المقررات', tpl: '/templates/courses-template.xlsx', desc: 'مقررات الكليات والمعاهد (الجهة، السنة، الفصل، الاسم، الرمز، الساعات، المدرّس). المقرر الموجود يُحدَّث ولا يتكرر.' },
    { k: 'grades', perm: 'grade:manage', title: 'العلامات', tpl: '/templates/grades-template.xlsx', desc: 'علامات الطلاب (الرقم الجامعي، المقرر، العام الدراسي، النظري والعملي). استورد المقررات أولاً.' },
  ];
  const st = {};   // لكل نوع: { file, b64, name, res, busy }
  const prevReset = UA.reset; UA.reset = () => { if (prevReset) prevReset(); for (const k of Object.keys(st)) delete st[k]; };

  const b64 = async (file) => { const u = new Uint8Array(await file.arrayBuffer()); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

  function card(K) {
    const s = st[K.k] ?? (st[K.k] = {}), r = s.res;
    let out = '';
    if (r) {
      const ok = r.errorCount === 0;
      out = `<div class="imp-sum"><div class="stat"><small>صفوف الملف</small><b>${r.total}</b></div><div class="stat"><small>${r.committed ? 'تم الاستيراد' : 'صالحة للاستيراد'}</small><b>${r.committed ? r.created + (r.updated || 0) : r.valid}</b></div><div class="stat"><small>مرفوضة</small><b>${r.errorCount}</b></div></div>
        ${r.committed ? `<p class="${ok ? 'ok-t' : 'reason'}">اكتمل الاستيراد${r.updated ? ` (${r.created} جديد، ${r.updated} محدَّث)` : ''}.</p>` : `<p class="hint">هذا فحص فقط: لم يُحفظ شيء بعد.${r.preview.length ? ` أمثلة: ${r.preview.slice(0, 3).map(esc).join('، ')}…` : ''}</p>`}
        ${r.unusedColumns && r.unusedColumns.length ? `<p class="small">أعمدة لم تُستخدم: ${r.unusedColumns.map(esc).join('، ')}</p>` : ''}
        ${r.errorCount ? `<div class="tbl-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>الصف</th><th>سبب الرفض</th></tr></thead><tbody>${r.errors.map((e) => `<tr><td>${e.row}</td><td>${esc(e.message)}</td></tr>`).join('')}</tbody></table></div>${r.errorCount > r.errors.length ? `<p class="small">يُعرض أول ${r.errors.length} خطأ فقط.</p>` : ''}` : ''}
        ${r.committed && r.credentialsXlsx ? `<div class="actions"><button class="btn pri" data-act="impcred" data-k="${K.k}">تحميل ملف بيانات الدخول (يظهر مرة واحدة)</button></div><p class="small">يحوي كلمات المرور المؤقتة؛ سلّمه للطلاب بالطريقة المعتمدة ثم احذفه. يُلزَم كل طالب بتغييرها عند أول دخول.</p>` : ''}
        ${!r.committed && r.valid > 0 ? `<div class="actions"><button class="btn pri" data-act="impgo" data-k="${K.k}"${s.busy ? ' disabled' : ''}>اعتماد الاستيراد (${r.valid} صف)</button></div>` : ''}`;
    }
    return `<section class="card"><h2>استيراد ${K.title}</h2><p class="hint" style="margin-top:0">${esc(K.desc)}</p>
      <div class="actions" style="margin-top:0"><a class="btn" href="${K.tpl}" download>تحميل قالب Excel</a></div>
      <div class="inline-form" style="margin-top:12px"><label>الملف (xlsx أو csv أو sql)<input type="file" id="imp-f-${K.k}" accept=".xlsx,.csv,.sql,.txt"></label><button class="btn" data-act="impcheck" data-k="${K.k}"${s.busy ? ' disabled' : ''}>${s.busy ? 'جارٍ المعالجة…' : 'فحص الملف'}</button></div>
      ${s.name ? `<p class="small">الملف المحدَّد: ${esc(s.name)}</p>` : ''}${out}</section>`;
  }

  UA.views.import = () => {
    const ks = KINDS.filter((K) => can(K.perm));
    return `<section class="card"><h2>الاستيراد الجماعي</h2><p class="hint" style="margin-top:0">حمّل القالب، عبّئه، ثم ارفعه. تُفحص الصفوف أولاً دون حفظ، وتُعرض الأخطاء برقم الصف، ثم تعتمد الاستيراد. ملفات <b>SQL</b> تُقرأ منها جمل <span dir="ltr" class="mono">INSERT</span> فقط ولا يُنفَّذ أي أمر SQL.</p></section><div class="stack" style="margin-top:16px">${ks.map(card).join('')}</div>`;
  };
  UA.loaders.import = async () => {};

  const run = async (K, commit) => {
    const s = st[K], inp = document.getElementById(`imp-f-${K}`), f = (inp && inp.files[0]) || null;
    if (f) { s.file = f; s.name = f.name; s.b64 = await b64(f); s.res = null; }
    if (!s.b64) { toast('اختر ملفاً أولاً'); return; }
    s.busy = true; UA.render();
    try { s.res = await api('POST', `/api/import/${K}`, { filename: s.name, data: s.b64, commit }); if (commit) s.b64 = null; }
    catch (e) { if (!e.status) throw e; s.res = null; toast(e.message); } finally { s.busy = false; UA.render(); }
  };
  Object.assign(UA.actions, {
    impcheck: (el, d) => run(d.k, false),
    impgo: (el, d) => { if (confirm('سيُحفظ الاستيراد في النظام. متابعة؟')) return run(d.k, true); },
    impcred: async (el, d) => {
      const r = st[d.k] && st[d.k].res; if (!r || !r.credentialsXlsx) return;
      const bin = atob(r.credentialsXlsx), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download = 'student-credentials.xlsx'; a.click();
      delete r.credentialsXlsx; setTimeout(() => { URL.revokeObjectURL(a.href); UA.render(); }, 500);
    },
  });
})();
</script>
<script>/* لوحة الإحصاءات: مؤشرات ومخططات SVG تفاعلية بنمط لوحات المعلومات، تحديث دوري، مرشحات (تحديد متقاطع)، وتصدير PDF / Word / Excel */
(function () {
  const UA = window.UA, { S, api, esc, toast } = UA;
  const PAL = ['#054239', '#C9A24B', '#0A8F7A', '#7A5C12', '#4DB6A0', '#2F6F9F', '#8C9A94', '#B3261E'];
  const D = { data: null, faculty: '', year: '', timer: null, paused: false, loading: false, err: '', exporting: '' };
  const prevReset = UA.reset;
  UA.reset = () => { if (prevReset) prevReset(); stop(); Object.assign(D, { data: null, faculty: '', year: '', paused: false, err: '', exporting: '' }); };
  const nf = new Intl.NumberFormat('en-US');
  const fmt = (v) => (v === null || v === undefined ? '—' : nf.format(v));
  const short = (s, n = 22) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));

  /* ---------- رسم المخططات (SVG) ---------- */
  const W = 520, H = 280;
  const tip = (t) => `<title>${esc(t)}</title>`;
  const empty = (msg = 'لا بيانات ضمن المرشحات الحالية') => `<svg viewBox="0 0 ${W} 120" role="img" aria-label="${msg}"><text x="${W / 2}" y="64" text-anchor="middle" class="ch-empty">${msg}</text></svg>`;
  const niceMax = (m) => { const raw = Math.max(m / 4, 0.25), p = 10 ** Math.floor(Math.log10(raw)), n = raw / p, step = Math.max((n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p, m <= 400 && Number.isInteger(m) ? 1 : 0); return step * 4; };

  function axisY(max, left, top, h, width) {
    return [0, 0.25, 0.5, 0.75, 1].map((f) => { const y = top + h - f * h; return `<line x1="${left}" x2="${width}" y1="${y}" y2="${y}" class="ch-grid"/><text x="${left - 6}" y="${y + 4}" text-anchor="end" class="ch-ax">${fmt(Math.round(max * f * 10) / 10)}</text>`; }).join('');
  }

  function barChart(t, sel) {
    const rows = t.rows; if (!rows.length || rows.every((r) => !r[1])) return empty();
    const L = 40, T = 14, B = 54, h = H - T - B, w = W - L - 8, max = niceMax(Math.max(...rows.map((r) => r[1]))), bw = Math.min(54, (w / rows.length) * 0.62);
    const bars = rows.map((r, i) => {
      const x = L + (w / rows.length) * (i + 0.5) - bw / 2, bh = (r[1] / max) * h, y = T + h - bh, id = t.ids ? t.ids[i] : null;
      const act = t.selectable ? ` data-act="dsel" data-t="${t.id}" data-v="${t.selectable === 'year' ? esc(r[0]) : id ?? ''}" tabindex="0" role="button"` : '';
      const on = (t.selectable === 'year' && String(D.year) === r[0]) || (t.selectable === true && id && String(D.faculty) === String(id));
      const dim = (D.faculty && t.selectable === true && !on) || (D.year && t.selectable === 'year' && !on);
      return `<g${act} class="ch-bar${dim ? ' dim' : ''}">${tip(`${r[0]}: ${fmt(r[1])}`)}<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh, 1)}" rx="4" fill="${on ? PAL[1] : PAL[0]}"/><text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" class="ch-val">${fmt(r[1])}</text>
        <text x="${x + bw / 2}" y="${T + h + 16}" text-anchor="middle" class="ch-ax">${esc(short(t.codes ? t.codes[i] : r[0], 9))}</text>${t.codes ? `<text x="${x + bw / 2}" y="${T + h + 30}" text-anchor="middle" class="ch-ax sm">${esc(short(r[0], 14))}</text>` : ''}</g>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.title)}">${axisY(max, L, T, h, W - 8)}${bars}</svg>`;
  }

  function hbarChart(t) {
    const rows = t.rows; if (!rows.length) return empty();
    const multi = t.headers.length > 2, rowH = 30, L = 150, hh = rows.length * rowH + 14, w = W - L - 56;
    const max = niceMax(Math.max(...rows.flatMap((r) => (multi ? [r[1], r[2]] : [r[1]])).map(Number), 1));
    const out = rows.map((r, i) => {
      const y = 8 + i * rowH, bars = (multi ? [[r[1], PAL[0]], [r[2], PAL[1]]] : [[r[1], PAL[0]]]).map(([v, c], k) => {
        const bw = (Number(v ?? 0) / (t.id === 'gradeByFaculty' ? 100 : max)) * w, bh = multi ? 10 : 18, yy = y + (multi ? k * 12 : 2);
        return `<rect x="${L}" y="${yy}" width="${Math.max(bw, 1)}" height="${bh}" rx="3" fill="${c}"/><text x="${L + bw + 6}" y="${yy + bh - 2}" class="ch-val" text-anchor="start">${v === null ? '—' : fmt(v)}</text>`;
      }).join('');
      return `<g class="ch-bar">${tip(`${r[0]}: ${r.slice(1).map(fmt).join(' / ')}`)}<text x="${L - 8}" y="${y + 15}" text-anchor="end" class="ch-ax lg">${esc(short(r[0], 24))}</text>${bars}</g>`;
    }).join('');
    const legend = multi ? `<g transform="translate(${W - 6},${hh + 4})" text-anchor="end"><rect x="-10" y="-9" width="10" height="10" fill="${PAL[0]}" rx="2"/><text x="-16" y="0" class="ch-ax" text-anchor="end">${esc(t.headers[1])}</text><rect x="-130" y="-9" width="10" height="10" fill="${PAL[1]}" rx="2"/><text x="-136" y="0" class="ch-ax" text-anchor="end">${esc(t.headers[2])}</text></g>` : '';
    return `<svg viewBox="0 0 ${W} ${hh + (multi ? 18 : 0)}" role="img" aria-label="${esc(t.title)}">${out}${legend}</svg>`;
  }

  function donutChart(t) {
    const rows = t.rows.filter((r) => r[1] > 0), total = rows.reduce((s, r) => s + r[1], 0); if (!total) return empty();
    const cx = 120, cy = 128, R = 92, r0 = 56; let a0 = -Math.PI / 2;
    const arcs = rows.map((r, i) => {
      const a1 = a0 + (r[1] / total) * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0, c = PAL[i % PAL.length];
      const p = (a, rad) => `${cx + rad * Math.cos(a)} ${cy + rad * Math.sin(a)}`, full = rows.length === 1;
      const d = full ? `M ${cx - R} ${cy} A ${R} ${R} 0 1 1 ${cx + R} ${cy} A ${R} ${R} 0 1 1 ${cx - R} ${cy} M ${cx - r0} ${cy} A ${r0} ${r0} 0 1 0 ${cx + r0} ${cy} A ${r0} ${r0} 0 1 0 ${cx - r0} ${cy} Z` : `M ${p(a0, R)} A ${R} ${R} 0 ${large} 1 ${p(a1, R)} L ${p(a1, r0)} A ${r0} ${r0} 0 ${large} 0 ${p(a0, r0)} Z`;
      a0 = a1; return `<path d="${d}" fill="${c}" fill-rule="evenodd" class="ch-seg">${tip(`${r[0]}: ${fmt(r[1])} (${Math.round((r[1] / total) * 1000) / 10}%)`)}</path>`;
    }).join('');
    const legend = rows.map((r, i) => `<g transform="translate(262,${30 + i * 26})"><rect width="12" height="12" rx="3" fill="${PAL[i % PAL.length]}"/><text x="-8" y="11" text-anchor="end" class="ch-ax lg" transform="translate(240,0)">${esc(short(r[0], 18))}</text><text x="22" y="11" class="ch-val" text-anchor="start">${fmt(r[1])} · ${Math.round((r[1] / total) * 100)}%</text></g>`).join('');
    return `<svg viewBox="0 0 ${W} 256" role="img" aria-label="${esc(t.title)}">${arcs}<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="ch-big">${fmt(total)}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle" class="ch-ax">الإجمالي</text>${legend}</svg>`;
  }

  function lineChart(t) {
    const rows = t.rows, ser = t.headers.length - 1; if (!rows.length || rows.every((r) => r.slice(1).every((v) => !v))) return empty();
    const L = 40, T = 16, B = 44, h = H - T - B, w = W - L - 14, max = niceMax(Math.max(...rows.flatMap((r) => r.slice(1).map(Number)), 1)), step = w / Math.max(rows.length - 1, 1);
    const X = (i) => L + step * i, Y = (v) => T + h - (v / max) * h;
    const lines = Array.from({ length: ser }, (_, s) => {
      const pts = rows.map((r, i) => `${X(i)},${Y(r[s + 1] ?? 0)}`), c = PAL[s];
      const area = s === 0 ? `<path d="M ${X(0)},${T + h} L ${pts.join(' L ')} L ${X(rows.length - 1)},${T + h} Z" fill="${c}" opacity=".10"/>` : '';
      return `${area}<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${s ? 'stroke-dasharray="6 4"' : ''}/>${rows.map((r, i) => `<circle cx="${X(i)}" cy="${Y(r[s + 1] ?? 0)}" r="4" fill="#fff" stroke="${c}" stroke-width="2" class="ch-dot">${tip(`${r[0]} — ${t.headers[s + 1]}: ${fmt(r[s + 1])}`)}</circle>`).join('')}`;
    }).join('');
    const xs = rows.map((r, i) => (i % 2 === 0 || rows.length < 8 ? `<text x="${X(i)}" y="${T + h + 16}" text-anchor="middle" class="ch-ax sm">${esc(short(r[0], 12))}</text>` : '')).join('');
    const legend = ser > 1 ? t.headers.slice(1).map((hd, s) => `<g transform="translate(${W - 10 - s * 130},${H - 8})"><rect x="-10" y="-9" width="10" height="10" rx="2" fill="${PAL[s]}"/><text x="-16" class="ch-ax" text-anchor="end">${esc(hd)}</text></g>`).join('') : '';
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.title)}">${axisY(max, L, T, h, W - 14)}${lines}${xs}${legend}</svg>`;
  }

  function stackChart(t) {
    const rows = t.rows; if (!rows.length) return empty();
    const L = 150, rowH = 30, hh = rows.length * rowH + 34, w = W - L - 44, max = niceMax(Math.max(...rows.map((r) => r[1] + r[2] + r[3]), 1)), cols = [PAL[1], PAL[0], PAL[7]];
    const body = rows.map((r, i) => {
      let x = L; const y = 8 + i * rowH;
      const segs = [1, 2, 3].map((k) => { const sw = (r[k] / max) * w, s = r[k] ? `<rect x="${x}" y="${y + 2}" width="${sw}" height="18" fill="${cols[k - 1]}" ${k === 1 ? 'rx="3"' : ''}>${tip(`${r[0]} — ${t.headers[k]}: ${fmt(r[k])}`)}</rect>` : ''; x += sw; return s; }).join('');
      return `<g class="ch-bar"><text x="${L - 8}" y="${y + 16}" text-anchor="end" class="ch-ax lg">${esc(short(r[0], 24))}</text>${segs}<text x="${x + 6}" y="${y + 16}" class="ch-val" text-anchor="start">${fmt(r[1] + r[2] + r[3])}</text></g>`;
    }).join('');
    const legend = [1, 2, 3].map((k, i) => `<g transform="translate(${W - 10 - i * 110},${hh - 6})"><rect x="-10" y="-9" width="10" height="10" rx="2" fill="${cols[k - 1]}"/><text x="-16" class="ch-ax" text-anchor="end">${esc(t.headers[k])}</text></g>`).join('');
    return `<svg viewBox="0 0 ${W} ${hh}" role="img" aria-label="${esc(t.title)}">${body}${legend}</svg>`;
  }

  const DRAW = { bar: barChart, hbar: hbarChart, donut: donutChart, line: lineChart, stack: stackChart };
  const chart = (t) => (DRAW[t.type] || barChart)(t);

  /* ---------- مؤشرات ---------- */
  function spark(v) {
    if (!v || v.length < 2 || !Math.max(...v)) return '';
    const m = Math.max(...v), pts = v.map((x, i) => `${(i / (v.length - 1)) * 100},${26 - (x / m) * 24}`).join(' ');
    return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  const kpiTile = (k) => `<div class="kpi ${k.tone || ''}"><small>${esc(k.label)}</small><b>${fmt(k.value)}${k.value !== null && k.unit ? `<span>${esc(k.unit)}</span>` : ''}</b>${k.hint ? `<em>${esc(k.hint)}</em>` : '<em>&nbsp;</em>'}${spark(k.spark)}</div>`;

  /* ---------- الصفحة ---------- */
  const SPAN = { byFaculty: 'w2', reqByService: 'w2', reqByMonth: 'w2', regByMonth: 'w2', gradeByFaculty: 'w2', byGovernorate: '' };
  function view() {
    const a = D.data;
    if (!a) return `<div class="empty">${D.err ? esc(D.err) : 'جارٍ تحميل الإحصاءات…'}</div>`;
    const fo = a.options.faculties.map((f) => `<option value="${f.id}"${String(D.faculty) === String(f.id) ? ' selected' : ''}>${esc(f.name)}</option>`).join('');
    const yo = a.options.years.map((y) => `<option value="${y}"${String(D.year) === String(y) ? ' selected' : ''}>${y}</option>`).join('');
    const upd = new Date(a.generatedAt).toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const exp = (k, label) => `<button class="btn sm" data-act="dexp" data-k="${k}"${D.exporting ? ' disabled' : ''}>${D.exporting === k ? 'جارٍ التجهيز…' : label}</button>`;
    return `<div class="dash" id="dash">
      <div class="dash-bar no-print"><div class="slicers"><label>الكلية / المعهد<select id="d-fac" data-chg="dfilter"><option value="">الكل</option>${fo}</select></label><label>سنة القيد<select id="d-year" data-chg="dfilter"><option value="">الكل</option>${yo}</select></label>
          ${D.faculty || D.year ? '<button class="btn sm" data-act="dclear">مسح المرشحات</button>' : ''}</div>
        <div class="dash-live"><span class="live-dot${D.paused ? ' off' : ''}"></span><span>${D.paused ? 'التحديث متوقف' : 'تحديث تلقائي كل دقيقة'} · آخر تحديث ${upd}</span><button class="btn sm" data-act="dpause">${D.paused ? 'استئناف' : 'إيقاف'}</button><button class="btn sm" data-act="drefresh">تحديث الآن</button></div></div>
      <div class="dash-bar no-print"><div class="exports"><b>تصدير:</b>${exp('pdf', 'PDF')}${exp('docx', 'Word')}${exp('xlsx', 'Excel')}</div><span class="small">PDF: تُفتح نافذة الطباعة فاختر «حفظ كـ PDF».</span></div>
      <div class="print-head"><b>تقرير الإحصاءات — الجامعة السورية للعلوم الأمنية</b><span>${esc(D.faculty ? (a.options.faculties.find((f) => String(f.id) === String(D.faculty)) || {}).name || '' : 'كل الجهات')}${D.year ? ' · سنة القيد ' + esc(D.year) : ''} · ${new Date(a.generatedAt).toLocaleString('ar-SY')}</span></div>
      <div class="kpis">${a.kpis.map(kpiTile).join('')}</div>
      <div class="vis-grid">${a.tables.map((t) => `<section class="vis ${SPAN[t.id] || ''}" data-vis="${t.id}"><header><h3>${esc(t.title)}</h3>${t.selectable ? '<span class="small no-print">انقر عموداً لتصفية اللوحة</span>' : ''}</header><div class="vis-body">${chart(t)}</div></section>`).join('')}</div></div>`;
  }

  /* ---------- التحميل والتحديث الدوري ---------- */
  const qs = () => new URLSearchParams({ ...(D.faculty ? { faculty: D.faculty } : {}), ...(D.year ? { year: D.year } : {}) }).toString();
  async function load(silent) {
    if (D.loading) return; D.loading = true;
    try { D.data = await api('GET', '/api/analytics?' + qs()); D.err = ''; }
    catch (e) { if (!e.status) throw e; D.err = e.message; }
    finally { D.loading = false; }
    if (S.view === 'dashboard' && !silent) UA.render(); else if (S.view === 'dashboard') softRender();
  }
  // التحديث الصامت يستبدل اللوحة فقط (لا يقطع تفاعل المستخدم مع القوائم)
  function softRender() { const el = document.getElementById('dash'); if (!el || document.activeElement?.closest?.('.slicers')) return; const t = document.createElement('div'); t.innerHTML = view(); el.replaceWith(t.firstElementChild); }
  function start() { stop(); D.timer = setInterval(() => { if (!D.paused && S.view === 'dashboard' && !document.hidden) load(true); }, 60000); }
  function stop() { if (D.timer) clearInterval(D.timer); D.timer = null; }

  UA.views.dashboard = () => view();
  UA.loaders.dashboard = async () => { await load(true); start(); };

  /* ---------- التصدير ---------- */
  const fontFace = async () => '';        // خط الموقع النظامي يُستخدم؛ خط AL Mohanad المرفق لا يحوي حروف Unicode العربية (انظر docs/PHASE2.md)
  const CSS = '.ch-grid{stroke:#DCE3DD;stroke-width:1}.ch-ax{fill:#566660;font:12px Cairo,Tahoma,"Noto Sans Arabic",sans-serif}.ch-ax.sm{font-size:11px}.ch-ax.lg{font-size:13px;fill:#10211D}.ch-val{fill:#10211D;font:700 12px Cairo,Tahoma,"Noto Sans Arabic",sans-serif}.ch-big{fill:#054239;font:700 26px Cairo,Tahoma,"Noto Sans Arabic",sans-serif}.ch-empty{fill:#566660;font:14px Cairo,Tahoma,"Noto Sans Arabic",sans-serif}.dim{opacity:.35}';
  async function chartJpeg(svgEl) {                       // SVG ← JPEG (خلفية بيضاء) لتضمينه في Word
    const clone = svgEl.cloneNode(true), vb = svgEl.viewBox.baseVal, w = 1040, h = Math.round((w * vb.height) / vb.width);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); clone.setAttribute('width', w); clone.setAttribute('height', h); clone.setAttribute('direction', 'ltr');
    const st = document.createElementNS('http://www.w3.org/2000/svg', 'style'); st.textContent = (await fontFace()) + CSS; clone.insertBefore(st, clone.firstChild);
    // data: وليس blob: لأن سياسة الأمان (CSP) تسمح بـ data: للصور فقط
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', 0.9).split(',')[1];
  }
  function saveBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  async function download(url, opt, name) {
    const res = await fetch(url, { credentials: 'same-origin', ...opt });
    if (!res.ok) { let m = 'تعذّر التصدير.'; try { m = (await res.json()).message || m; } catch { /* */ } throw Object.assign(new Error(m), { status: res.status }); }
    saveBlob(await res.blob(), name);
  }

  Object.assign(UA.actions, {
    dsel: async (el, d) => { const v = d.v; if (d.t === 'byYear') D.year = String(D.year) === v ? '' : v; else D.faculty = String(D.faculty) === String(v) ? '' : v; await load(false); },
    dclear: async () => { D.faculty = ''; D.year = ''; await load(false); },
    dpause: async () => { D.paused = !D.paused; UA.render(); },
    drefresh: async () => { await load(false); toast('تم التحديث'); },
    dexp: async (el, d) => {
      D.exporting = d.k; UA.render();
      try {
        const q = qs();
        if (d.k === 'pdf') { D.exporting = ''; UA.render(); setTimeout(() => window.print(), 80); return; }
        if (d.k === 'xlsx') await download('/api/analytics/export.xlsx?' + q, {}, 'statistics-report.xlsx');
        else if (d.k === 'docx') {
          const charts = []; for (const v of document.querySelectorAll('.vis[data-vis]')) { const svg = v.querySelector('svg'); if (svg) { try { charts.push({ id: v.dataset.vis, jpeg: await chartJpeg(svg) }); } catch { /* مخطط تعذّر تحويله: يبقى جدوله */ } } }
          await download('/api/analytics/export.docx', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ faculty: D.faculty || null, year: D.year || null, charts }) }, 'statistics-report.docx');
        }
        toast('تم التصدير');
      } catch (e) { if (!e.status) throw e; toast(e.message); } finally { D.exporting = ''; UA.render(); }
    },
  });
  window.addEventListener('change', async (e) => { if (e.target && e.target.dataset && e.target.dataset.chg === 'dfilter') { D.faculty = document.getElementById('d-fac').value; D.year = document.getElementById('d-year').value; await load(false); } });
})();
</script>
<script>window.UA.start();
</script>
</body>
